<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="cv-build-id" content="{[BUILD_ID]}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{[TITLE]}</title>
  {[HEAD_META]}
  <base href="{[BASE_PATH]}">
  <link rel="icon" type="image/svg+xml" href="./logo/index.svg">
  <link rel="stylesheet" href="{[CSS_PATH]}"></link>
  {[ICONS_LINK]}
  <link rel="preload" as="font" type="font/ttf" crossorigin href="./js/material-symbols-outlined-400.ttf">
  <script async src="./js/icons-ready.js"></script>
  <script type="module" src="{[JS_PATH]}"></script>
</head>
<body {[BODY_ATTRS]}>
  <header>{[HEADER_CONTENT]}</header>
  <main>
    <article>{[CONTENT]}</article>
  </main>
  <footer>{[FOOTER_CONTENT]}</footer>
  <side-panel {[SIDE_PANEL_ATTRS]}></side-panel>
</body>
</html>
