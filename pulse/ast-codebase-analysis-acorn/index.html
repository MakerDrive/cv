ю автоматизацию там, где она работает хорошо, и агентную адаптацию там, где действительно появляется неопределённость.","chat":{"text":"Подробная ветка: Мобильная SMM-платформа."}},"f360-details":{"id":"f360-details","sceneId":"f360-studio","directives":[{"id":"f360-details.path","type":"frame","target":"article.f360-studio.production-path","policy":"required","timing":{"phase":"setup"}},{"id":"f360-details.result-one","type":"activate","target":"article.f360-studio.gallery-result-one","policy":"required","safePath":"open-source-backed-result","timing":{"phase":"speech","anchor":"speech","quote":"Публичные примеры этой работы сохранились","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"f360-details.period","type":"native-selection","target":"article.f360-studio.gallery-result-two","policy":"required","occurrence":1,"quote":"2021–2022 годах","timing":{"phase":"speech","anchor":"speech","quote":"Для меня F триста шестьдесят был ещё одним примером","occurrence":1,"edge":"start","offsetMs":-950}}],"return":{"anchor":"short.after.f360","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"F360 переносила дисциплину музейной съёмки в коммерческий студийный процесс. Для каждого объекта я планировал ракурсы и свет, контролировал исходные фотографии, проводил фотограмметрическую обработку и проверял геометрию с текстурами. Я собрал единый производственный путь от установки до финальной 3D-модели и её публикации. Публичные примеры сохранились на YouTube и в портфолио Sketchfab.","speech":"F триста шестьдесят переносила дисциплину музейной съёмки в коммерческую студийную работу. Для каждого объекта нужно было определить подходящие ракурсы и свет. Я контролировал исходный материал ещё на этапе съёмки. Плохой исходник гораздо дешевле переснять сразу, чем обнаружить проблему после долгой фотограмметрической обработки. После съёмки я проводил фотограмметрическую обработку и проверял геометрию модели. Отдельно контролировались текстуры. В результате получался не просто набор фотографий или сырой скан. Я выстроил единый путь от физического объекта до готовой три дэ модели и её презентации или публикации. Публичные примеры этой работы сохранились в видео и в портфолио моделей. Для меня F триста шестьдесят был ещё одним примером того, как исследовательская технология становится реальным производственным процессом.","chat":{"text":"Подробная ветка: F360 Studio."}},"autobox-details":{"id":"autobox-details","sceneId":"autobox","directives":[{"id":"autobox-details.working-system","type":"frame","target":"article.autobox-v1.working-system","policy":"required","timing":{"phase":"setup"}},{"id":"autobox-details.working-route","type":"marker","target":"article.autobox-v1.working-system","policy":"required","intent":"emphasize","shape":"route","series":"autobox-working","timing":{"phase":"speech","anchor":"speech","quote":"Рабочая система управляла камерой","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"autobox-details.video","type":"frame","target":"article.autobox-v1.netsuke-video","policy":"optional","timing":{"phase":"speech","anchor":"speech","quote":"собственноручно сканировал японские нэцкэ","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox-details.bronze","type":"activate","target":"article.autobox-v1.benin-bronze","policy":"optional","safePath":"rotate-interactive-model","timing":{"phase":"speech","anchor":"speech","quote":"характер поверхности бенинской бронзы","occurrence":1,"edge":"start","offsetMs":-1050}}],"return":{"anchor":"short.after.autobox","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Рабочая система управляла камерой, светом и позиционированием. Она сначала снимала полную серию, после чего компьютерное зрение анализировало материал, оценивало резкость и отбирало исходники для построения 3D-модели. Следующий прототип начинал с чернового 3D-сканирования и упрощённой формы предмета. Затем он заранее рассчитывал весь план детальной макросъёмки: зоны, ракурсы, положения камеры, параметры оптики, глубину резкости и перекрытие. Расчёт учитывал сложную геометрию предмета, диапазон механики, габариты камеры, препятствия и безопасное расстояние. После проверки принципа я проектировал дополнительные контуры безопасности, включая лидарный контроль расстояния на случай смещения предмета. Этот слой остался следующим этапом разработки. Система AUTOBOX уже применялась в музеях. В Эрмитаже я сканировал японские нэцкэ, а технологическая линия применялась для бенинской бронзы в Кунсткамере.","speech":"Auto Box развивался итерациями. Важно, что это не был законченный автономный робот со всеми задуманными функциями одновременно. Часть контуров уже работала с реальными музейными объектами. Более автономные функции находились на разных стадиях прототипирования. Рабочая система управляла камерой, светом и механикой позиционирования. Сначала она могла снять полную серию. После этого компьютерное зрение анализировало материал, оценивало резкость и помогало отбирать фотографии для построения три дэ модели. Следующий уровень автоматизации был гораздо интереснее. Система должна была сначала получить черновую три дэ форму конкретного предмета. А затем сама построить план более детальной макросъёмки. Такой план включал зоны объекта, ракурсы, положения камеры, параметры оптики, глубину резкости и необходимое перекрытие кадров. Но геометрии предмета недостаточно. Нужно учитывать реальные размеры камеры, диапазон механики, возможные препятствия и безопасное расстояние до музейного объекта. После проверки основного принципа я проектировал и дополнительные контуры безопасности. Например, лидарный контроль расстояния на случай, если предмет случайно изменит положение. Этот слой оставался следующим этапом разработки. При этом первая рабочая технология уже применялась на настоящих музейных объектах. В Эрмитаже я собственноручно сканировал японские нэцкэ. Эти объекты использовались в музейной серии Нэцкэ под увеличительным стеклом. Позолоченный Будда показывает сохранение мелких повреждений и царапин на сложной металлической поверхности. У могольского кинжала одновременно присутствуют полированный металл, позолота и драгоценные камни. Для фотограмметрии это очень сложное сочетание материалов. А здесь можно увидеть сложный рельеф и характер поверхности бенинской бронзы. Для меня Auto Box был важен ещё и архитектурно. В ранних системах автоматизация в основном исполняла заранее описанный процесс. Здесь я уже двигался к системе, которая сначала изучает конкретный объект, затем формирует план и после этого управляет физическим исполнением.","chat":{"text":"Подробная ветка: AUTOBOX."}},"complexscan-details":{"id":"complexscan-details","sceneId":"complexscan","directives":[{"id":"complexscan-details.platform","type":"frame","target":"article.complexscan.transparent-platform","policy":"required","timing":{"phase":"setup"}},{"id":"complexscan-details.light","type":"frame","target":"article.complexscan.controlled-light","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"стабильная механика и управляемый свет","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"complexscan-details.gallery","type":"activate","target":"article.complexscan.product-gallery","policy":"required","safePath":"prototype-product-packaging-delivery","timing":{"phase":"speech","anchor":"speech","quote":"собирал прототипы и первые изделия","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"complexscan-details.autobox","type":"marker","target":"article.complexscan.autobox-museum-link","policy":"required","intent":"emphasize","shape":"route","series":"complexscan-applications","timing":{"phase":"speech","anchor":"speech","quote":"музейного направления Auto Box","occurrence":1,"edge":"start","offsetMs":-1500}}],"return":{"anchor":"short.after.complexscan","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Я придумал ComplexScan как коммерческую линию профессионального оборудования после open-source работы над PhotoPizza. Прозрачный вращающийся диск, стабильная механика и управляемый свет давали чистые исходники для съёмки объектов в формате 360 градусов и фотограмметрии. Я собственноручно собирал прототипы и первые изделия, разбивал конструкцию на детали для профильных подрядчиков, затем выполнял финальную сборку и тестирование. Отдельно я проектировал защитную упаковку, оформлял экспортные документы и организовывал доставки клиентам в разные страны. Позже R&amp;D этой линии стало частью технической базы музейных систем вроде AUTOBOX.","speech":"Complex Scan я придумал как следующий коммерческий этап после открытой работы над PhotoPizza. Здесь уже нужно было не просто доказать идею, а сделать оборудование, которое будет постоянно работать у клиента. Прозрачный вращающийся диск, стабильная механика и управляемый свет давали чистые исходники для съёмки на триста шестьдесят градусов и для фотограмметрии. Прозрачная поверхность особенно важна для предметной съёмки. Она позволяет работать со светом вокруг объекта и не оставляет под ним обычное непрозрачное основание. Я собственноручно собирал прототипы и первые изделия. Когда конструкция стабилизировалась, я разбивал её на производимые детали и передавал отдельные операции профильным подрядчикам. После этого выполнял финальную сборку и тестирование. Но коммерческое оборудование не заканчивается в момент, когда устройство заработало. Его нужно безопасно упаковать, отправить через границу, оформить документы и получить у клиента в рабочем состоянии. Поэтому я отдельно проектировал транспортную упаковку, занимался экспортными документами и организовывал международные поставки. Ар эн ди этой линии позже стал технической базой для более специализированных систем. В том числе Booth Bot и музейного направления Auto Box. Здесь я уже проектировал не отдельный механизм, а почти весь производственный процесс целиком. Главная проблема была в масштабе. На большом складе постоянно появляются новые позиции. Возить каждую бутылку в отдельную профессиональную студию неудобно и дорого. При этом качество каталога должно оставаться одинаковым. Поэтому световая схема была частью самой машины. Для стеклянной бутылки особенно важен рисунок отражений. Управляемые панели позволяли заранее сформировать этот рисунок и повторять его для каждой следующей позиции. При необходимости свет можно было перенастроить под другой визуальный стиль. Корпус отсекал случайный свет помещения. Поэтому результат не зависел от окна, потолочного света или времени суток. Бутылки имеют разную высоту. Система автоматически измеряла объект и перемещала камеру так, чтобы сохранялась правильная геометрия и композиция. То есть оператору не нужно было заново выставлять штатив и строить кадр. Его задача была максимально простой. Подготовить товар. Удалить пыль и следы с поверхности. Поставить бутылку внутрь. После съёмки система отделяла объект от фона и готовила изображение для каталога. Следующим этапом должна была стать непосредственная публикация результата на сайте. Тогда весь процесс от физической бутылки на складе до карточки товара мог работать как единый автоматизированный конвейер.","chat":{"text":"Подробная ветка: ComplexScan."}},"photopizza-details":{"id":"photopizza-details","sceneId":"photopizza","directives":[{"id":"photopizza-details.origin","type":"native-selection","target":"article.photopizza.megavisor-origin","policy":"required","occurrence":1,"quote":"доступный, быстрый и повторяемый способ","timing":{"phase":"setup"}},{"id":"photopizza-details.attribution","type":"frame","target":"article.photopizza.controller-attribution","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Один универсальный контроллер подключался","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza-details.documentation","type":"frame","target":"article.photopizza.assembly-calibration","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"описывал сборку и калибровку","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza-details.media","type":"activate","target":"article.photopizza.controller-media","policy":"required","safePath":"open-three-controller-media","timing":{"phase":"speech","anchor":"speech","quote":"продолжил развивать управляющее программное обеспечение","occurrence":1,"edge":"start","offsetMs":-1050}}],"return":{"anchor":"short.after.photopizza","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Изначально PhotoPizza была внутренним инструментом MEGAVISOR — облачного сервиса для фото 360 объектов, 3D-панорам, видео и виртуальных туров. В MEGAVISOR я разрабатывал технологию и оборудование и составил техническое задание на управляющее программное обеспечение. Первую версию для Arduino по этому заданию реализовал привлечённый специалист. После MEGAVISOR я сам продолжил управляющее программное обеспечение на JavaScript и Espruino. Я подбирал доступные компоненты и подробно описывал сборку с калибровкой, чтобы люди могли собирать свои версии. Один контроллер управлял поворотной платформой, слайдером камеры и автоматической панорамной головкой. Этот открытый проект дал практическую основу для последующих экспериментов ComplexScan и AUTOBOX.","speech":"Для меня Megavisor был важен ещё и потому, что здесь я работал сразу на нескольких уровнях. Я занимался не только производством контента. Я участвовал в формировании самого продукта. Мы рассматривали интерактивный контент не как набор отдельных плееров. Пользователь мог двигаться между разными способами представления одного пространства или объекта. Например, находясь внутри сферической панорамы помещения, увидеть мотоцикл и открыть его как отдельный объект. После этого вращать уже сам мотоцикл. А затем перейти к обычной галерее или другому связанному материалу. Хот споты работали как связи между такими состояниями. Для веба того периода это был достаточно смелый подход. Параллельно я отвечал за реальное производство такого контента. Я руководил фотостудией, организовывал выездные съёмки на складах и в магазинах заказчиков и координировал фотографов и ретушёров. При росте объёмов быстро стало понятно, что одна хорошая фотостудия проблему не решает. Нужен технологический процесс, который можно масштабировать. Отдельным направлением были промо и обучающие материалы. Мы показывали фотографам и пользователям сервиса, как снимать контент на триста шестьдесят градусов, как его обрабатывать и как использовать в реальных проектах. То есть мы одновременно развивали сам продукт, технологию производства и рынок вокруг нового формата. Именно из этой производственной задачи выросла PhotoPizza. В самом начале мне было важно не сразу проектировать идеальное устройство, а быстро проверить принцип. Поэтому первый прототип был собран из доступных промышленных компонентов. Конструкционный алюминиевый профиль, шаговый двигатель и готовые элементы позволили быстро проверить механику и технологию съёмки. После этого я уже мог оптимизировать систему под реальную работу фотографа. Большая грузоподъёмность сама по себе не была новой задачей. Сложность была в том, чтобы получить её при небольшой массе и простой транспортировке. Я использовал конструкцию из листовых материалов и максимально простые механические узлы. Даже опорные элементы можно было собирать из доступных подшипников и стандартного крепежа. Так устройство было проще производить и ремонтировать. Постепенно появился модельный ряд под разные масштабы задачи. От макросъёмки небольших объектов до человека, бытовой техники и тяжёлых предметов. Подвесная конфигурация позволяла перевернуть сам принцип. Объект подвешивался и вращался сверху. Так можно было снимать люстру, украшение или велосипед, а ориентацию готовой последовательности изменить уже при обработке. При этом электронику не требовалось дублировать для каждой установки. Один универсальный контроллер подключался к разной механике. Он мог управлять поворотным столом, слайдером камеры и моторизированной панорамной головкой. Когда PhotoPizza стала открытым проектом, я подбирал досту
