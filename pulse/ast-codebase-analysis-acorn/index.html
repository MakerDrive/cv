        {"version":1,"contractRevision":"34c3d40c1c53cd320362aff9888c1727c977b9b3c7dcfb0d3cc73683bcf29af9","conversationRevision":"cv-show-agent-context-v1","narrationLocale":"ru","runtimePolicy":{"attention":{"cursorCount":1,"cursorPersistent":true,"exclusive":["cursor","frame","native-selection","activation"]},"audio":{"detailVideo":"static-frame-with-tour-speech","exclusive":true,"shortVideo":"static-frame-with-tour-speech"},"branch":{"preserves":["mode","scene","position","playback","subject"],"returnState":"paused"},"marker":{"accumulatesWithinSeries":true,"clearOnAttentionChange":true},"ownership":{"productScenario":"cv","sharedRuntime":"symbiote-ui"},"userInteraction":{"autoPause":"meaningful-only","ignored":["hover","pointer-move"],"resumeAction":"continue"}},"short":["positioning","symbiote-workspace","symbiote-ui","symbiote-engine","agent-portal","symbiote-video-studio","adaptive-maximo-workbench","agent-pool-mcp","project-graph-mcp","lifecycle-messaging-platform","mobile-smm-platform","f360-studio","autobox","complexscan","photopizza","finale"],"scenes":[{"id":"positioning","period":"present","directives":[{"id":"positioning.tenure-marker","type":"marker","target":"profile.experience.15-plus","policy":"required","intent":"emphasize","shape":"oval","series":"positioning-tenure","timing":{"phase":"speech","anchor":"speech","quote":"Сейчас, в две тысячи двадцать шестом году","occurrence":1,"edge":"start","offsetMs":-600}},{"id":"positioning.workspace-transition","type":"frame","target":"project-card.symbiote-workspace","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"и за что именно отвечал","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"positioning.open","type":"navigate","target":"profile/photo","policy":"required","timing":{"phase":"setup"}}],"title":"Кто я","subtitle":"Привет, я Владимир. Я R&amp;D-инженер: нахожу проблемы и продуктовые возможности, формулирую задачи, придумываю решения и довожу их до работающего результата — самостоятельно или отвечая за свою часть работы в команде. Сейчас мой основной фокус — программные платформы и агентные продукты. В этой презентации я покажу, как этот R&amp;D-подход работает в разных предметных областях — от программных платформ до медиа и оборудования. В каждом проекте я отдельно обозначу свою роль.","speech":"Привет, я Владимир. Я ар эн ди инженер. Больше всего мне интересны задачи, где готового технического задания ещё нет. Есть цель или проблема, и сначала нужно понять, как это вообще должно работать. За свою карьеру я был сооснователем Megavisor, создавал собственные коммерческие и опенсорс проекты и работал с программными платформами, медиа, автоматизацией и оборудованием. Сейчас, в две тысячи двадцать шестом году, мой основной фокус это программные платформы и агентные продукты. Для этой презентации я отобрал несколько проектов, где хорошо виден мой подход. Я не только решаю уже сформулированные задачи. Я нахожу проблемы и новые возможности, формирую идеи проектов и продуктов, запускаю их с нуля или развиваю новые направления внутри существующих систем. В каждом проекте я отдельно покажу, какую задачу решал и за что именно отвечал.","chat":{"text":"Начинаю краткий обзор опыта и проектов."}},{"id":"symbiote-workspace","period":"2026","projectId":"projects/symbiote-workspace","directives":[{"id":"workspace.open","type":"navigate","target":"projects/symbiote-workspace","policy":"required","timing":{"phase":"setup"}},{"id":"workspace.intro-frame","type":"frame","target":"article.symbiote-workspace.intro","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Чем сложнее система","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"workspace.portable-config","type":"native-selection","target":"article.symbiote-workspace.portable-config","policy":"required","occurrence":1,"quote":"переносимая исполняемая конфигурация","timing":{"phase":"speech","anchor":"speech","quote":"Такое рабочее пространство можно сохранить","occurrence":1,"edge":"start","offsetMs":-950}},{"id":"workspace.agent-portal-card","type":"frame","target":"article.symbiote-workspace.agent-portal","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"постепенно становятся его конфигурациями","occurrence":1,"edge":"start","offsetMs":-1450}}],"branchId":"workspace-details","title":"Symbiote Workspace","subtitle":"Начну с текущего центра моей работы. С середины 2026 года я развиваю Symbiote Workspace — универсальную среду, где агент собирает рабочее пространство под конкретную задачу. Результат сохраняется в виде исполняемой конфигурации, которую можно переносить. Некоторые мои текущие проекты появились раньше Workspace и теперь постепенно становятся его конфигурациями.","speech":"С середины две тысячи двадцать шестого года я развиваю Symbiote Workspace. Сейчас это центральный проект в моей работе. Чем сложнее система, тем тяжелее становится её универсальный интерфейс. Новому человеку часто нужно сначала изучить саму систему и только потом начинать решать в ней свои задачи. В Workspace я иду от конкретной задачи человека. Агент собирает рабочее пространство из готовых блоков под текущую ситуацию. Но на сборке интерфейса процесс не заканчивается. Интерфейс может объяснить, как он устроен, зачем появился конкретный элемент, почему сейчас важен определённый шаг, где есть риск и где требуется дополнительное подтверждение. Получается динамическая среда, где агент помогает справляться со сложностью, а человек сохраняет контроль и принимает решения. Такое рабочее пространство можно сохранить как исполняемую конфигурацию. Его можно перенести, открыть снова и продолжить работу. Некоторые мои проекты появились раньше Workspace и теперь постепенно становятся его конфигурациями.","chat":{"actionLabel":"Подробнее о Symbiote Workspace","text":"Показываю текущий центр работы — Symbiote Workspace."}},{"id":"symbiote-ui","period":"2026","projectId":"projects/symbiote-ui","directives":[{"id":"symbiote-ui.open","type":"navigate","target":"projects/symbiote-ui","policy":"required","timing":{"phase":"setup"}},{"id":"symbiote-ui.graph-tooling","type":"frame","target":"article.symbiote-ui.graph-tooling","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"графовые инструменты и семантические контракты","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"symbiote-ui.current-show","type":"frame","target":"portfolio.show-stage","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"интерфейс этого си ви","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"symbiote-ui.show-player-pointer","type":"frame","target":"portfolio.show-stage","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"То, что происходит прямо сейчас","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"symbiote-ui.github-link","type":"frame","target":"project-link.symbiote-ui.github","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Интерфейс переводит внимание","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"symbiote-ui.details-pointer","type":"marker","target":"chat.action.symbiote-ui.details","policy":"required","intent":"pointer","shape":"arrow","timing":{"phase":"speech","anchor":"speech","quote":"объясняет сам себя","occurrence":1,"edge":"start","offsetMs":-1500}}],"branchId":"symbiote-ui-details","title":"Symbiote UI","subtitle":"В основе визуальной части Workspace — open-source библиотека Symbiote UI. В ней собраны компоненты, компоновки, графовые инструменты и семантические контракты интерфейса. На её основе построен и весь интерфейс этого CV: навигация, рабочие панели, чат и плеер презентации. Исходный код и техническое описание доступны на GitHub, а прямо в этой презентации можно открыть подробный разбор проекта.","speech":"В две тысячи двадцать шестом году визуальной основой Workspace стала моя опенсорс библиотека Symbiote UI. В ней собраны компоненты, компоновки, графовые инструменты и семантические контракты интерфейса. Агент не просто берёт готовые блоки и размещает их на экране. Вместе с интерфейсом он формирует машиночитаемый контекст. Он описывает, что это за элементы, зачем они находятся на этом месте, какие у них состояния и какие действия доступны. В том числе такой контекст может публиковаться через Веб эм си пи. Благодаря этому агент после сборки понимает структуру собственного интерфейса и может использовать тот же контекст, чтобы объяснить её человеку. На Symbiote UI построен и интерфейс этого си ви. На нём работают панели, чат и сама интерактивная система презентации. То, что происходит прямо сейчас, это пример того же подхода. Рассказ синхронизирован со страницей. Интерфейс переводит внимание между элементами, выделяет их и буквально объясняет сам себя.","chat":{"actionLabel":"Подробнее о Symbiote UI","text":"Показываю визуальную библиотечную основу — Symbiote UI."}},{"id":"symbiote-engine","period":"2026","projectId":"projects/symbiote-engine","directives":[{"id":"symbiote-engine.open","type":"navigate","target":"projects/symbiote-engine","policy":"required","timing":{"phase":"setup"}},{"id":"symbiote-engine.intro","type":"frame","target":"article.symbiote-engine.intro","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"библиотека для сервисов","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"symbiote-engine.workspace-join","type":"marker","target":"article.symbiote-engine.readonly-graph-demo","policy":"required","intent":"emphasize","shape":"underline","series":"workspace-layers","timing":{"phase":"speech","anchor":"speech","quote":"Workspace связывает визуальную и исполнительную части","occurrence":1,"edge":"start","offsetMs":-1500}}],"branchId":"symbiote-engine-details","title":"Symbiote Engine","subtitle":"Функциональные блоки даёт Symbiote Engine. Это серверная библиотека для сервисов, графов выполнения и автоматизации. Workspace соединяет визуальные блоки UI с этим исполнительным слоем в одной конфигурации.","speech":"В две тысячи двадцать шестом году я также выделил серверный исполнительный слой в Symbiote Engine. Если Symbiote UI даёт визуальные блоки, то Engine даёт функциональные. Это библиотека для сервисов, графов выполнения, автоматизации и состояния. Workspace связывает визуальную и исполнительную части в одной конфигурации.","chat":{"actionLabel":"Подробнее о Symbiote Engine","text":"Показываю исполнительный слой — Symbiote Engine."}},{"id":"agent-portal","period":"2025–2026","projectId":"projects/agent-portal","directives":[{"id":"agent-portal.open","type":"navigate","target":"projects/agent-portal","policy":"required","timing":{"phase":"setup"}},{"id":"agent-portal.path","type":"marker","target":"article.agent-portal.process-path","policy":"required","intent":"emphasize","shape":"route","series":"agent-portal-process","timing":{"phase":"speech","anchor":"speech","quote":"собственный управляющий слой","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"agent-portal.human-decision","type":"marker","target":"article.agent-portal.human-decision","policy":"required","intent":"emphasize","shape":"oval","series":"agent-portal-process","timing":{"phase":"speech","anchor":"speech","quote":"контроль над контекстом, задачами и ресурсами","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"agent-portal.open-source","type":"frame","target":"article.agent-portal.open-source","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Часть слоя управления мы открыли","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"agent-portal.github-link","type":"frame","target":"project-link.agent-portal.github","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"А внутри Agent Portal есть два важных инструмента","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"agent-portal.demo-link","type":"marker","target":"project-link.agent-portal.demo","policy":"required","intent":"pointer","shape":"arrow","timing":{"phase":"speech","anchor":"speech","quote":"Project Graph отвечает за структуру","occurrence":1,"edge":"start","offsetMs":-1500}}],"branchId":"agent-portal-details","title":"Agent Portal","subtitle":"Agent Portal — один из проектов, которые я сейчас переношу в Symbiote Workspace как конфигурации. Я развиваю его с начала две тысячи двадцать шестого года. Проект появился как собственный управляющий слой над разными агентными средами — своего рода harness над harnesses. Он объединяет их в один видимый процесс и позволяет сохранять контроль над контекстом, задачами и ресурсами, при этом быстро меняя агентов, модели и способы доступа к ним. Когда я начинал эту линию, я не нашёл готового решения с таким сочетанием возможностей, поэтому стал развивать собственный вариант. Мы решили открыть управляющий контур mcp-agent-portal, хотя развиваем Agent Portal прежде всего для собственной практической работы. Исходный код этого контура доступен на GitHub, а интерфейс Agent Portal можно посмотреть в интерактивном демо. Чтобы показать его внутреннее устройство, дальше я разберу два отдельных инструмента. Agent Pool MCP отвечает за исполнение и распределение ресурсов, а Project Graph MCP — за структуру и контекст проекта.","speech":"С начала две тысячи двадцать шестого года я развиваю Agent Portal. Сейчас я постепенно переношу его в Symbiote Workspace как одну из конфигураций. Проект появился как мой собственный управляющий слой над разными агентными средами. По сути это единый процесс поверх разных агентов, моделей и способов доступа к ним. Он позволяет сохранять контроль над контекстом, задачами и ресурсами и при этом менять исполнителей под конкретный этап. Когда я начинал эту линию, я не нашёл готового решения с нужным мне сочетанием возможностей, поэтому стал развивать собственную архитектуру. Часть слоя управления мы открыли как опенсорс проект. А внутри Agent Portal есть два важных инструмента. Agent Pool отвечает за исполнение и распределение ресурсов. Project Graph отвечает за структуру и контекст проекта.","chat":{"actionLabel":"Подробнее об Agent Portal","text":"Показываю Agent Portal и его исполняемый процесс."}},{"id":"symbiote-video-studio","period":"2025–2026","projectId":"projects/symbiote-video-studio","directives":[{"id":"video-studio.open","type":"navigate","target":"projects/symbiote-video-studio","policy":"required","timing":{"phase":"setup"}},{"id":"video-studio.visible-process","type":"native-selection","target":"article.symbiote-video-studio.semantic-flow","policy":"required","occurrence":1,"quote":"один видимый процесс","timing":{"phase":"speech","anchor":"speech","quote":"предпросмотр и рендер собраны","occurrence":1,"edge":"start","offsetMs":-950}},{"id":"video-studio.demo","type":"activate","target":"article.symbiote-video-studio.demo","policy":"required","safePath":"graph-timeline-preview","timing":{"phase":"speech","anchor":"speech","quote":"Агент работает с семантическими элементами","occurrence":1,"edge":"start","offsetMs":-1050}}],"branchId":"video-studio-details","title":"Symbiote Video Studio","subtitle":"Ещё один актуальный проект — Symbiote Video Studio. Материалы, граф, таймлайн, предпросмотр и рендер собраны здесь в один видимый процесс. Агент работает с семантическими элементами интерфейса, а человек может проверить каждый этап. Сейчас Studio оформляется как конфигурация Symbiote Workspace.","speech":"В две тысячи двадцать пятом и две тысячи двадцать шестом годах я развивал Symbiote Video Studio. Сейчас этот проект постепенно оформляется как конфигурация Workspace. Материалы, граф, таймлайн, предпросмотр и рендер собраны здесь в один видимый процесс. Агент работает с семантическими элементами интерфейса. А человек может видеть и проверять каждый этап.","chat":{"actionLabel":"Подробнее о Symbiote Video Studio","text":"Показываю Symbiote Video Studio как актуальный workspace-кейс."}},{"id":"adaptive-maximo-workbench","period":"Date pending","projectId":"projects/adaptive-maximo-workbench","directives":[{"id":"maximo.open","type":"navigate","target":"projects/adaptive-maximo-workbench","policy":"required","timing":{"phase":"setup"}},{"id":"maximo.work-orders","type":"frame","target":"article.adaptive-maximo-workbench.work-orders","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"постоянно собирать контекст своей задачи","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"maximo.asset-context","type":"frame","target":"article.adaptive-maximo-workbench.asset-context","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"оказываются в одном актуальном контексте","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"maximo.agentic-demo","type":"frame","target":"media/adaptive-maximo-workbench/youtube/qsXmS4mFvYc","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"В этом демонстраторе я показываю следующий шаг","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"maximo.xr-demo","type":"frame","target":"media/adaptive-maximo-workbench/youtube/DUzUnbO2VVs","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"А здесь я развиваю ту же идею в икс ар пространстве","occurrence":1,"edge":"start","offsetMs":-1450}}],"branchId":"maximo-workbench-details","title":"Adaptive Maximo Workbench","subtitle":"Следующий пример — Adaptive Maximo Workbench. Он показывает, как заявки, оборудование, локации, бригады и доступные действия собираются в одном рабочем пространстве с общим актуальным контекстом. Сейчас это демонстрационный проект на стадии альфа-версии, показывающий возможности Workspace. Подключение к реальной системе Maximo выполняется как отдельная интеграция.","speech":"В две тысячи двадцать шестом году одним из демонстрационных направлений Workspace стал мой эксперимент с ай би эм Maximo. Это хороший пример проблемы, которую я пытаюсь решить. В больших системах управления активами в одном контуре находятся заявки, оборудование, локации, бригады и множество связанных действий. Человеку приходится постоянно собирать контекст своей задачи из разных частей большой системы. Workspace позволяет строить процесс вокруг самой задачи. Заявка, конкретное оборудование, его состояние и доступные действия оказываются в одном актуальном контексте. В этом демонстраторе я показываю следующий шаг. Агент собирает рабочее пространство под конкретную задачу, а затем проводит человека по созданному интерфейсу и объясняет, что здесь находится и зачем это нужно. А здесь я развиваю ту же идею в икс ар пространстве. Рабочий интерфейс размещается вокруг пользователя, и вместе с ним появляются интерактивные три дэ объекты. Редуктор можно буквально взять в руки, повернуть и рассмотреть нужную деталь. При этом объект остаётся связанным с контекстом рабочей задачи.","chat":{"actionLabel":"Подробнее об Adaptive Maximo Workbench","text":"Показываю корпоративный Demo/Alpha-кейс Adaptive Maximo Workbench."}},{"id":"agent-pool-mcp","period":"2026","projectId":"projects/agent-pool-mcp","directives":[{"id":"agent-pool.open","type":"navigate","target":"projects/agent-pool-mcp","policy":"required","timing":{"phase":"setup"}},{"id":"agent-pool.flow","type":"marker","target":"article.agent-pool-mcp.execution-flow","policy":"required","intent":"emphasize","shape":"underline","series":"agent-pool-flow","quote":"tracks process state","occurrence":1,"timing":{"phase":"speech","anchor":"speech","quote":"распределяет задачи между агентами","occurrence":1,"edge":"start","offsetMs":-1500}}],"branchId":"agent-pool-details","title":"Agent Pool MCP","subtitle":"В начале 2026 года Agent Pool MCP оформился как самостоятельный MCP-сервер, который можно напрямую подключить к агенту. В Agent Portal он используется как исполнительный слой: распределяет задачи между агентами, отслеживает владение и состояние, передаёт сессии и маршрутизирует ресурсы.","speech":"В начале две тысячи двадцать шестого года Agent Pool MCP оформился как самостоятельный эм си пи сервер. Его можно подключить непосредственно к агенту. В Agent Portal он работает как исполнительный слой. Он распределяет задачи между агентами, отслеживает состояние и владение задачей, передаёт сессии и маршрутизирует ресурсы.","chat":{"actionLabel":"Подробнее об Agent Pool MCP","text":"Показываю исполнительный слой Agent Pool MCP."}},{"id":"project-graph-mcp","period":"2026","projectId":"projects/project-graph-mcp","directives":[{"id":"project-graph.open","type":"navigate","target":"projects/project-graph-mcp","policy":"required","timing":{"phase":"setup"}},{"id":"project-graph.example","type":"frame","target":"article.project-graph-mcp.graph-example","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"компактный граф репозитория","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"project-graph.context","type":"native-selection","target":"article.project-graph-mcp.browser-fact","policy":"required","occurrence":1,"quote":"компактный структурированный инженерный контекст","timing":{"phase":"speech","anchor":"speech","quote":"раскрыть для неё зависимости","occurrence":1,"edge":"start","offsetMs":-950}},{"id":"project-graph.node","type":"activate","target":"article.project-graph-mcp.readonly-node","policy":"optional","safePath":"expand-readonly-node","timing":{"phase":"speech","anchor":"speech","quote":"документацию и дополнительный контекст","occurrence":1,"edge":"start","offsetMs":-1050}}],"branchId":"project-graph-details","title":"Project Graph MCP","subtitle":"Второй инструмент — Project Graph MCP, самостоятельный open-source MCP-сервер для навигации по кодовой базе. Он строит компактный граф репозитория, который в Agent Portal отображается как визуальная карта проекта. Человек может выбрать интересующий узел, а агент — раскрыть для нужной части зависимости, скелеты кода, документацию и более подробный контекст. Так человек и агент работают с одной структурой проекта, а модель получает релевантные проверяемые факты, не перечитывая весь репозиторий. Исходный код доступен на GitHub, а интерактивное демо доступно по соседней ссылке.","speech":"В две тысячи двадцать шестом году я выделил второй самостоятельный инструмент. Project Graph MCP это опенсорс эм си пи сервер для навигации по кодовой базе. Он строит компактный граф репозитория. В Agent Portal этот граф отображается как визуальная карта проекта. Человек может выбрать интересующую часть проекта. А агент может раскрыть для неё зависимости, скелеты кода, документацию и дополнительный контекст. Так человек и агент работают с одной структурой проекта.","chat":{"actionLabel":"Подробнее о Project Graph MCP","text":"Показываю слой структуры и контекста Project Graph MCP."}},{"id":"lifecycle-messaging-platform","period":"2022–2026","projectId":"projects/lifecycle-messaging-platform","directives":[{"id":"lifecycle.open","type":"navigate","target":"projects/lifecycle-messaging-platform","policy":"required","timing":{"phase":"setup"}},{"id":"lifecycle.scope","type":"native-selection","target":"article.lifecycle-messaging-platform.product-scope","policy":"required","occurrence":1,"quote":"клиентских коммуникаций на основе согласия","timing":{"phase":"speech","anchor":"speech","quote":"маркетинговая платформа для автоматизации","occurrence":1,"edge":"start","offsetMs":-950}},{"id":"lifecycle.product-number","type":"marker","target":"article.lifecycle-messaging-platform.product-surfaces","policy":"required","intent":"emphasize","shape":"number","label":"1","series":"lifecycle-layers","timing":{"phase":"speech","anchor":"speech","quote":"сегментацию аудитории, управление кампаниями","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"lifecycle.runtime-number","type":"marker","target":"article.lifecycle-messaging-platform.backend-runtime","policy":"required","intent":"emphasize","shape":"number","label":"2","series":"lifecycle-runtime","timing":{"phase":"speech","anchor":"speech","quote":"распределение заданий, связь с удалёнными инстансами","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"lifecycle.digital-twin","type":"marker","target":"article.lifecycle-messaging-platform.digital-twin","policy":"required","intent":"emphasize","shape":"underline","series":"lifecycle-twin","quote":"mirrored the GSM modem pool","occurrence":1,"timing":{"phase":"speech","anchor":"speech","quote":"локальный Digital Twin","occurrence":1,"edge":"start","offsetMs":-1500}}],"branchId":"lifecycle-platform-details","title":"Lifecycle Messaging Platform","subtitle":"Теперь вернусь к периоду 2022–2026 и к Lifecycle Messaging Platform. Это маркетинговая платформа для автоматизации клиентских коммуникаций. Она включает сегментацию аудитории, управление маркетинговыми кампаниями, opt-in SMS-сценарии и аналитику. Я проектировал API, распределение заданий, связь с удалёнными инстансами, мониторинг и инструменты эксплуатации. Для проверки модемного контура я сделал локальный Digital Twin с виртуальными устройствами и воспроизводимыми сценариями.","speech":"С две тысячи двадцать второго по две тысячи двадцать шестой год я развивал Lifecycle Messaging Platform. Это маркетинговая платформа для автоматизации клиентских коммуникаций. Она объединяла сегментацию аудитории, управление кампаниями, сценарии согласованных эс эм эс коммуникаций и аналитику. Я проектировал эй пи ай, распределение заданий, связь с удалёнными инстансами, мониторинг и инструменты эксплуатации. А для проверки физического модемного звена я сделал локальный Digital Twin с виртуальными устройствами и воспроизводимыми сценариями.","chat":{"actionLabel":"Подробнее о Lifecycle Messaging Platform","text":"Показываю распределённый контур Lifecycle Messaging Platform."}},{"id":"mobile-smm-platform","period":"Date pending","projectId":"projects/mobile-smm-platform","directives":[{"id":"mobile-smm.open","type":"navigate","target":"projects/mobile-smm-platform","policy":"required","timing":{"phase":"setup"}},{"id":"mobile-smm.overview","type":"frame","target":"article.mobile-smm-platform.system-map","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"В одном контуре были собраны","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"mobile-smm.stable-path","type":"marker","target":"article.mobile-smm-platform.stable-path","policy":"required","intent":"emphasize","shape":"route","series":"mobile-smm-flow","timing":{"phase":"speech","anchor":"speech","quote":"Андроид устройства выполняли","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"mobile-smm.agent-update","type":"marker","target":"article.mobile-smm-platform.agent-update","policy":"required","intent":"emphasize","shape":"oval","series":"mobile-smm-flow","timing":{"phase":"speech","anchor":"speech","quote":"агент мог остановить процесс","occurrence":1,"edge":"start","offsetMs":-3500}}],"branchId":"mobile-smm-details","title":"Мобильная SMM-платформа","subtitle":"Отдельный прикладной кейс — мобильная SMM-платформа для управляемой работы с несколькими профилями. В одном контуре собраны медиаматериалы, публикации, расписание, входящие обращения и очередь. Android-устройства выполняют стабильные операции по готовым сценариям. При изменении интерфейса агент останавливает процесс, анализирует экран и готовит обновление сценария для проверки. Управляемость обеспечивают лимиты, дедупликация, согласование и журнал.","speech":"Отдельным прикладным проектом стала мобильная эс эм эм платформа для управляемой работы с несколькими профилями. В одном контуре были собраны медиаматериалы, публикации, расписание, входящие обращения и очередь. Андроид устройства выполняли стабильные операции по заранее подготовленным сценариям. Если интерфейс приложения изменялся, агент мог остановить процесс, проанализировать актуальный экран и подготовить обновлённый сценарий для проверки. Управляемость обеспечивали лимиты, дедупликация, подтверждения и журнал действий.","chat":{"actionLabel":"Подробнее о мобильной SMM-платформе","text":"Показываю отдельный прикладной кейс мобильной SMM-платформы."}},{"id":"f360-studio","period":"2021–2022","projectId":"projects/f360-studio","directives":[{"id":"f360.open","type":"navigate","target":"projects/f360-studio","policy":"required","timing":{"phase":"setup"}},{"id":"f360.process","type":"frame","target":"article.f360-studio.production-path","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"весь путь от физической съёмочной установки","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"f360.result","type":"activate","target":"article.f360-studio.gallery-result","policy":"required","safePath":"open-source-backed-result","timing":{"phase":"speech","anchor":"speech","quote":"до геометрии, текстур и готовой презентации модели","occurrence":1,"edge":"start","offsetMs":-1050}}],"branchId":"f360-details","title":"F360 Studio","subtitle":"Теперь вернусь по истории программно-аппаратных проектов. В 2021–2022 годах я основал и вёл F360 Studio. Это проект высокоточного 3D-сканирования. Я выстраивал процесс от физической съёмочной установки и управляемого света до геометрии, текстур и готовой презентации модели.","speech":"В две тысячи двадцать первом и две тысячи двадцать втором годах я основал и вёл F360 Studio. Это была коммерческая студия высокоточного три дэ сканирования. Здесь опыт музейной фотограмметрии превращался уже в законченный производственный процесс. Я выстраивал весь путь от физической съёмочной установки и управляемого света до геометрии, текстур и готовой презентации модели.","chat":{"actionLabel":"Подробнее о F360 Studio","text":"Перехожу к исторической программно-аппаратной ветке и F360 Studio."}},{"id":"autobox","period":"2019–2021","projectId":"projects/autobox-v1","directives":[{"id":"autobox.open","type":"navigate","target":"projects/autobox-v1","policy":"required","timing":{"phase":"setup"}},{"id":"autobox.video-01","type":"frame","target":"media/autobox-v1/youtube/IPEY0yiVb-I","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Ещё до изготовления установки я сделал её три дэ визуализацию","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-02","type":"frame","target":"media/autobox-v1/youtube/NWpMtNZjrzI","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"проверял технологию фотограмметрии","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-03","type":"frame","target":"media/autobox-v1/youtube/8XsSHyQFtV8","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"промежуточный результат одного из таких экспериментов","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-04","type":"frame","target":"media/autobox-v1/youtube/zb47xAYQBcE","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"перешёл к физическому прототипу","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-05","type":"frame","target":"media/autobox-v1/youtube/us3vQHuTYPw","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"сканирует настоящий музейный объект в Эрмитаже","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-06","type":"frame","target":"media/autobox-v1/youtube/FugBzpZqXZ0","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"результат на позолоте","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-07","type":"frame","target":"media/autobox-v1/youtube/iNqxRJgrqM8","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"полированном металле","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-08","type":"frame","target":"media/autobox-v1/youtube/M0cHqy3cScc","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"драгоценных камнях","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-09","type":"frame","target":"media/autobox-v1/youtube/o4XzMKW8a2E","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"сложной бронзовой поверхности","occurrence":1,"edge":"start","offsetMs":-1450}}],"branchId":"autobox-details","title":"AUTOBOX","subtitle":"Перед F360 была музейная технология AUTOBOX, которую я развивал в 2019–2021 годах. Здесь показана предварительная 3D-визуализация оборудования AUTOBOX. Я подготовил её ещё до сборки установки, чтобы представить будущую конструкцию партнёрам, с которыми мы работали над 3D-сканированием музейных объектов в Эрмитаже. Здесь я отлаживаю процесс фотограмметрии на поворотном столе PhotoPizza. Это один из предварительных экспериментов, проведённых до разработки установки для Эрмитажа. Здесь показан промежуточный результат той же отладки в RealityCapture. Слева видны исходные фотографии позолоченного Будды, а в 3D-пространстве я вращаю уже обработанную модель и проверяю результат фотограмметрии перед разработкой оборудования для Эрмитажа. Здесь я собственноручно изготавливаю одну из деталей AUTOBOX v1 — лазером вырезаю вентиляционную сетку для светового модуля. Здесь собранный прототип AUTOBOX v1 сканирует нэцкэ в Эрмитаже. Это вводный ролик эрмитажной серии «Нэцкэ под увеличительным стеклом». Представленные в ней нэцкэ я собственноручно сканировал и визуализировал во время отладки технологии AUTOBOX. Для того же позолоченного Будды я сделал художественную 3D-визуализацию. Она показывает качество сканирования сложного металлического объекта: сохранились мелкие детали, повреждения и царапины. Здесь — художественная визуализация могольского кинжала из собрания Эрмитажа. Сочетание полированного металла, позолоты и инкрустации драгоценными камнями делало его особенно сложным для фотограмметрии, но нам удалось сохранить и форму, и детали разных материалов. Здесь — художественная визуализация головы королевы-матери из Королевства Бенин. Сканирование точно передало сложный рельеф и патину бронзовой поверхности.","speech":"С две тысячи девятнадцатого по две тысячи двадцать первый год внутри исследовательского направления Complex Scan я развивал Auto Box. Это был более сложный ар эн ди проект для автоматизации три дэ сканирования музейных объектов. В серийной предметной съёмке процесс можно заранее настроить под класс похожих товаров. Здесь почти каждый новый предмет создавал новую задачу. Своя геометрия. Свой материал. Свои поверхности. И отдельные требования по безопасности. Поэтому целью было постепенно автоматизировать уже не только движение оборудования, но и построение процесса съёмки под конкретный объект. Ещё до изготовления установки я сделал её три дэ визуализацию. До разработки сложной механики я отдельно проверял технологию фотограмметрии на более простом оборудовании. Здесь уже виден промежуточный результат одного из таких экспериментов. После этого я перешёл к физическому прототипу. А здесь первая рабочая версия Auto Box уже сканирует настоящий музейный объект в Эрмитаже. На этих примерах можно увидеть результат на позолоте, полированном металле, драгоценных камнях и сложной бронзовой поверхности.","chat":{"actionLabel":"Подробнее об AUTOBOX","text":"Показываю музейную технологию AUTOBOX."}},{"id":"complexscan","period":"2017–2022","projectId":"projects/complexscan","directives":[{"id":"complexscan.open","type":"navigate","target":"projects/complexscan","policy":"required","timing":{"phase":"setup"}},{"id":"complexscan.line","type":"frame","target":"article.complexscan.product-line","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"коммерческая линия оборудования","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"complexscan.video-01","type":"frame","target":"media/complexscan/youtube/MHfWHxVSgn4","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Система поддерживала несколько режимов автоматической съёмки","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"complexscan.video-02","type":"frame","target":"media/complexscan/youtube/PFPoitVEWcE","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"физического пульта или через веб приложение","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"complexscan.delivery","type":"native-selection","target":"article.complexscan.international-delivery","policy":"required","occurrence":1,"quote":"доставки клиентам в разные страны","timing":{"phase":"speech","anchor":"speech","quote":"экспортная документация и международная логистика","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"complexscan.boothbot-open","type":"navigate","target":"projects/boothbot","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Одним из специализированных проектов","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"complexscan.boothbot-gallery","type":"media","target":"media/boothbot/ims/gallery","policy":"required","finalFrame":5,"frameHoldMs":1000,"frames":[1,2,3,4,5],"mode":"short-muted-montage","safePath":"boothbot-five-frame-gallery-sequence","timing":{"phase":"speech","anchor":"speech","quote":"компактную автоматизированную фотостудию","occurrence":1,"edge":"start","offsetMs":-2050}},{"id":"complexscan.boothbot-catalog-ready","type":"marker","target":"article.boothbot.solution","policy":"required","intent":"emphasize","shape":"oval","series":"boothbot-result","quote":"готовый материал для каталога","occurrence":1,"timing":{"phase":"speech","anchor":"speech","quote":"готовый материал для каталога","occurrence":1,"edge":"start","offsetMs":-3300}}],"branchId":"complexscan-details","title":"ComplexScan","subtitle":"Теперь вернусь к ComplexScan — коммерческой линии оборудования, чьи разработки стали частью технической базы AUTOBOX. Я развивал ComplexScan в 2017–2022 годах. В линию входили прозрачные платформы для бестеневой съёмки предметов в формате фото 360 и для 3D-сканирования. Здесь я демонстрирую одну из таких платформ и веб-приложение, из которого управляю ею. Здесь я показываю обновлённые версии поворотной платформы ComplexScan и веб-приложения для управления ею. Я проектировал оборудование и метод съёмки как единый продукт и довёл линию до первых международных поставок. Отдельным прикладным проектом стал BoothBot. Это система автоматизации каталожной съёмки винных бутылок непосредственно на складе заказчика. Система объединяла компактную съёмочную будку, управляемые световые панели, моторизированную камеру, пресеты съёмки и автоматическую обработку фотографий. Световая сцена была заранее настроена для бестеневой съёмки и контролируемых бликов, поэтому фотографии практически не требовали ручной коррекции. Система автоматически отделяла бутылку от фона, оптимизировала изображение и выдавала готовый материал для каталога. Благодаря этому сотрудники без студийного опыта могли получать повторяемый результат прямо на складе. Следующим этапом должна была стать прямая публикация готовых фотографий на сайте, но развитие проекта было приостановлено.","speech":"С две тысячи семнадцатого по две тысячи двадцать второй год я развивал профессиональное направление Complex Scan. Это была коммерческая линия оборудования для автоматизации предметной съёмки и три дэ сканирования. Внутри направления появлялись как универсальные системы, так и специализированное оборудование под конкретные процессы. Основой стали профессиональные поворотные платформы с прозрачной рабочей поверхностью из осветлённого стекла. Здесь требования к механике, ресурсу, точности и производительности были уже заметно выше, чем у открытого проекта PhotoPizza. Система поддерживала несколько режимов автоматической съёмки. Можно было работать пошагово. А для большого потока использовать непрерывное вращение и серийную съёмку камеры. Управлять оборудованием можно было с физического пульта или через веб приложение. Я проектировал механику и метод съёмки как единый продукт. Я собирал прототипы и первые экземпляры, готовил конструкцию для подрядчиков, выполнял финальную сборку и тестирование. Затем добавились упаковка, экспортная документация и международная логистика. В результате Complex Scan прошёл путь от ар эн ди прототипов до оборудования, которое поставлялось клиентам в разные страны. Одним из специализированных проектов внутри этого профессионального направления стал Booth Bot. Он решал конкретную производственную задачу. Нужно было автоматизировать каталожную съёмку большого потока винных бутылок непосредственно на складе заказчика. Не перевозить товар в фотостудию. А перенести студийный процесс к товару. По сути мы построили компактную автоматизированную фотостудию. Световые панели создавали заданный рисунок бликов. Закрытая конструкция изолировала сцену от внешнего освещения. Система автоматически определяла высоту бутылки и позиционировала камеру. От оператора требовалось подготовить бутылку и поставить её внутрь. Остальной настроенный процесс система выполняла автоматически. После съёмки изображение отделялось от фона, обрабатывалось и превращалось в готовый материал для каталога.","chat":{"actionLabel":"Подробнее о ComplexScan","text":"Показываю коммерческую линейку оборудования ComplexScan."}},{"id":"photopizza","period":"2010–2022","projectId":"projects/photopizza","directives":[{"id":"photopizza.open","type":"navigate","target":"projects/photopizza","policy":"required","timing":{"phase":"setup"}},{"id":"photopizza.origin","type":"native-selection","target":"article.photopizza.megavisor-origin","policy":"required","occurrence":1,"quote":"внутри проекта MEGAVISOR","timing":{"phase":"speech","anchor":"speech","quote":"Я отвечал за ар эн ди съёмочного направления","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"photopizza.megavisor-promo","type":"frame","target":"media/megavisor/youtube/c3cCmDqO04c","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"В этом ролике виден общий принцип платформы","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza.page-open","type":"navigate","target":"projects/photopizza","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"PhotoPizza я начал развивать с две тысячи десятого года","occurrence":1,"edge":"start","offsetMs":-1150}},{"id":"photopizza.video-01","type":"frame","target":"media/photopizza/youtube/2lO2VsZFAz0","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Сначала я собрал прототип из доступных промышленных компонентов","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza.video-02","type":"frame","target":"media/photopizza/youtube/6CpdVcjtZoU","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"На этом прототипе мы отработали основные принципы системы","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza.mechanics","type":"frame","target":"article.photopizza.mechanics","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"совместить небольшую массу с высокой грузоподъёмностью","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza.controller","type":"frame","target":"article.photopizza.controller","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"слайдером PhotoSnail и моторизированной панорамной головкой","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza.video-03","type":"frame","target":"media/photopizza/youtube/f1cB4X1wI50","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"простой вариант платформы из доступных деталей","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza.video-04","type":"frame","target":"media/photopizza/youtube/cFPJqtcWNSU","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Позже PhotoPizza стала опенсорс проектом","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza.video-05","type":"frame","target":"media/photopizza/youtube/HeLMIjuMZac","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"с телефона по вай фай можно было управлять","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza.spinner","type":"frame","target":"media/photopizza/ims/spinner","policy":"required","playOnSettle":true,"timing":{"phase":"speech","anchor":"speech","quote":"результат масштабирования технологии на крупные объекты","occurrence":1,"edge":"start","offsetMs":-1450}}],"branchId":"photopizza-details","title":"PhotoPizza","subtitle":"В начале этой линии была PhotoPizza, которую я развивал с 2010 года. Проект появился внутри MEGAVISOR как инструмент для повторяемой съёмки объектов на 360 градусов. Здесь показан ускоренный демонстрационный ролик о сборке первой версии PhotoPizza — без подробной инструкции. Это промо MEGAVISOR, где показан весь спектр поддерживаемого контента, включая съёмку объектов на 360 градусов. Я продумал механику, электронику, прошивку, документацию и упаковку. Таймлапс сборки прототипа PhotoPizza из конструкционного алюминиевого профиля и шагового двигателя. Позже PhotoPizza стала open-source проектом. Здесь я показываю, как собрать простую поворотную платформу из подноса IKEA и вручную снять объект со всех сторон. Такие демонстрационные ролики я продюсировал для MEGAVISOR, чтобы популяризировать формат и снизить порог входа в технологию. Здесь я показываю новое веб-приложение PhotoPizza: с телефона запускаю съёмку и по Wi‑Fi управляю поворотным столом и камерой через веб-приложение. Универсальный блок управления работал с поворотными платформами, слайдером камеры и моторизированной панорамной головкой. На грузовой поворотной платформе PhotoPizza мы снимали даже тяжёлые объекты, включая мотоциклы, на 360 градусов. Проект продолжал развиваться до две тысячи двадцать второго года.","speech":"В начале две тысячи десятых годов одной из ключевых точек в моей истории стал Megavisor. Я был сооснователем проекта и техническим директором. Я отвечал за ар эн ди съёмочного направления и производство интерактивного контента. Megavisor был облачной платформой для фото на триста шестьдесят градусов, сферических три дэ панорам, видео и виртуальных туров. Я участвовал в проработке интерактивного плеера, который связывал эти форматы между собой. Например, из панорамы помещения можно было открыть находящийся внутри объект. Затем перейти к его вращению на триста шестьдесят градусов. А после этого открыть связанные фотографии и другие материалы. В этом ролике виден общий принцип платформы и то, как разные форматы могли работать внутри одного интерактивного пространства. В съёмочном направлении я руководил студией Gate Nine и выездным производством. Я организовывал съёмки, координировал фотографов и ретушёров, разрабатывал оборудование и выстраивал технологические процессы. Я также продюсировал промо и обучающие видеоматериалы, чтобы снизить порог входа в новый для рынка формат. Рост объёмов съёмки привёл к следующей инженерной задаче. Процесс нужно было автоматизировать. Так внутри Megavisor появилась PhotoPizza. PhotoPizza я начал развивать с две тысячи десятого года. Проект появился как решение конкретной производственной задачи. Съёмку объектов на триста шестьдесят градусов нужно было поставить на поток, чтобы она легко масштабировалась. Сначала я собрал прототип из доступных промышленных компонентов. Он позволил нам быстро проверить механику и саму технологию съёмки. На этом прототипе мы отработали основные принципы системы. После этого я начал проектировать PhotoPizza как лёгкое, мобильное и доступное решение. Одной из ключевых задач было совместить небольшую массу с высокой грузоподъёмностью. Платформу можно было привезти на выездную съёмку и установить силами одного фотографа. При этом крупные версии выдерживали человека и позволяли снимать тяжёлые и габаритные предметы. В результате PhotoPizza выросла в целый модельный ряд. Появились и подвесные версии для люстр, украшений, велосипедов и других объектов. Система оставалась модульной. Один блок управления мог работать с платформами разных размеров, слайдером PhotoSnail и моторизированной панорамной головкой. Параллельно мы снижали порог входа в саму технологию. Например, я сделал простой вариант платформы из доступных деталей, чтобы фотограф мог сначала проверить сам формат почти без вложений. Позже PhotoPizza стала опенсорс проектом. Вместе с оборудованием развивалась и программная часть. В итоге с телефона по вай фай можно было управлять оборудованием и камерой через веб приложение. А это результат масштабирования технологии на крупные объекты. Интерактивную последовательность мотоцикла можно вращать и рассматривать со всех сторон.","chat":{"actionLabel":"Подробнее о PhotoPizza","text":"Показываю открытую основу этой линии — PhotoPizza."}},{"id":"finale","period":"настоящее","directives":[{"id":"finale.map","type":"navigate","target":"projects/index","policy":"required","timing":{"phase":"setup"}},{"id":"finale.history","type":"frame","target":"portfolio.map.historical-branch","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Но для меня это один тип работы","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"finale.scale-route","type":"marker","target":"portfolio.map.engineering-scale-route","policy":"required","intent":"emphasize","shape":"route","series":"finale-scale","timing":{"phase":"speech","anchor":"speech","quote":"Проверяю идеи на практике","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"finale.workspace","type":"frame","target":"project-card.symbiote-workspace","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"это Symbiote Workspace","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"finale.actions","type":"chat-action","target":"chat.actions.finale","policy":"required","actions":["projects","resume","contact"],"persistent":true,"timing":{"phase":"speech","anchor":"speech","quote":"Здесь можно подробнее посмотреть мои проекты","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"finale.contacts","type":"activate","target":"profile.contacts","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"связаться со мной","occurrence":1,"edge":"start","offsetMs":-1050}}],"title":"Возврат в настоящее","subtitle":"А теперь вернусь в настоящее. От программно-аппаратных систем для съёмки я пришёл к распределённой инфраструктуре и текущим агентным рабочим средам. Во всех этих проектах я соединяю исследование, архитектуру и реализацию в работающий процесс с понятными границами и проверяемым результатом. Сейчас главным центром этой работы стал Symbiote Workspace. Здесь можно продолжить знакомство с проектами, открыть резюме или связаться со мной.","speech":"Все эти проекты находятся в разных предметных областях. Но для меня это один тип работы. Я нахожу проблемы и новые возможности. Придумываю и формирую проекты, продукты и технические решения. Запускаю их с нуля или развиваю новые направления внутри уже существующих систем. Проверяю идеи на практике и довожу их до работающего результата. Иногда работа начинается практически с чистого листа. Иногда новая идея появляется внутри уже существующего продукта и постепенно превращается в отдельное направление или отдельный проект. В зависимости от задачи это может быть программное обеспечение, искусственный интеллект, электроника, механика, компьютерное зрение или сочетание нескольких технологий. Сейчас мой основной фокус находится в области программных платформ и агентных систем. Один из текущих проектов в этом направлении это Symbiote Workspace. Но сама предметная область для меня не является ограничением. Мне интересны сложные проекты, где можно увидеть новую возможность, разобраться в проблеме и превратить идею в работающую систему. Здесь можно подробнее посмотреть мои проекты, открыть резюме, исходный код или связаться со мной.","chat":{"text":"Возвращаю рассказ в настоящее и оставляю итоговые действия."}}],"branches":{"workspace-details":{"id":"workspace-details","sceneId":"symbiote-workspace","directives":[{"id":"workspace-details.flow-frame","type":"frame","target":"article.symbiote-workspace.config-flow","policy":"required","timing":{"phase":"setup"}},{"id":"workspace-details.flow-route","type":"marker","target":"article.symbiote-workspace.config-flow","policy":"required","intent":"emphasize","shape":"route","series":"workspace-config-flow","timing":{"phase":"speech","anchor":"speech","quote":"Агент выбирает подходящие готовые блоки","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"workspace-details.artifact","type":"frame","target":"article.symbiote-workspace.config-artifact","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Конфигурацию можно изменять уже во время работы","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"workspace-details.hosts","type":"frame","target":"article.symbiote-workspace.host-examples","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Они остаются на стороне хоста","occurrence":1,"edge":"start","offsetMs":-1450}}],"return":{"anchor":"short.after.workspace","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Рабочая среда описывается конфигурацией: в ней задаются компоновка, панели, модули, действия и связи. Агент подбирает готовые блоки, валидирует конфигурацию и собирает интерфейс в браузере. Конфигурацию можно обновлять во время работы, сохранять и открывать в совместимом host-приложении. Секреты, авторизация и пользовательские данные остаются на стороне host. Я развиваю эту архитектуру как общий слой для специализированных рабочих процессов.","speech":"Если посмотреть глубже, основной объект Workspace это не заранее написанное приложение, а конфигурация рабочей среды. В ней задаются компоновка, панели, модули, действия и связи между ними. Агент выбирает подходящие готовые блоки, формирует конфигурацию, проверяет её и собирает интерфейс в браузере. Это важно, потому что агент не генерирует каждый раз произвольный интерфейс с нуля. Он работает с известными компонентами и с понятными контрактами. Конфигурацию можно изменять уже во время работы. Например, добавить новую панель, перестроить рабочий процесс или открыть другой инструмент, не пересобирая отдельное приложение целиком. После этого состояние можно сохранить и открыть в другом совместимом хост приложении. При этом секреты, авторизация и пользовательские данные не нужно переносить внутрь самой конфигурации. Они остаются на стороне хоста. Для меня это позволяет разделить две вещи. Есть переносимое описание рабочего процесса. И есть конкретная среда, которая предоставляет ему доступ к данным, авторизации и инфраструктуре. Я развиваю Workspace как общий слой для специализированных рабочих процессов, а не как одно приложение для одной предметной области.","chat":{"text":"Подробная ветка: Symbiote Workspace."}},"symbiote-ui-details":{"id":"symbiote-ui-details","sceneId":"symbiote-ui","directives":[{"id":"symbiote-ui-details.composition","type":"native-selection","target":"article.symbiote-ui.programmatic-composition","policy":"required","occurrence":1,"quote":"интерфейсы должны быть компонуемыми программно","timing":{"phase":"setup"}},{"id":"symbiote-ui-details.catalog","type":"frame","target":"article.symbiote-ui.provider-catalog","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"публиковать свою роль, состояние","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"symbiote-ui-details.manifest","type":"activate","target":"article.symbiote-ui.manifest-demo","policy":"required","safePath":"open-readonly-manifest","timing":{"phase":"speech","anchor":"speech","quote":"манифесты и семантические контракты","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"symbiote-ui-details.workspace-route","type":"marker","target":"article.symbiote-ui.workspace-link","policy":"required","intent":"pointer","shape":"arrow","series":"symbiote-ui-workspace","timing":{"phase":"speech","anchor":"speech","quote":"Workspace использует этот каталог","occurrence":1,"edge":"start","offsetMs":-1500}}],"return":{"anchor":"short.after.symbiote-ui","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Я развиваю Symbiote UI как библиотеку интерфейсных блоков, которые можно компоновать программно и описывать для агентов. Компоненты публикуют роли, состояния и безопасные действия через манифесты и WebMCP-контракты. Workspace использует этот каталог при сборке рабочей среды. Продуктовый смысл добавляет конкретная конфигурация, а библиотека сохраняет нейтральные переиспользуемые возможности.","speech":"Я развиваю Symbiote UI как библиотеку нейтральных интерфейсных блоков. Главная идея в том, что интерфейсы должны быть компонуемыми программно. Компонент при этом представляет собой не только визуальный элемент. Он может публиковать свою роль, состояние и безопасные действия. Для этого используются манифесты и семантические контракты. В том числе Веб эм си пи контракты. Так агент получает не набор пикселей, а понятную модель возможностей интерфейса. Например, он может знать, что перед ним список заявок, какая заявка выбрана, какие действия разрешены и какие данные связаны с текущим состоянием. Workspace использует этот каталог, когда собирает конкретную рабочую среду. Продуктовый смысл появляется уже на уровне конфигурации. Один и тот же нейтральный блок может использоваться в совершенно разных предметных областях. Для меня это принципиальное разделение. Библиотека предоставляет переиспользуемые возможности. А конкретный продукт или рабочий процесс придаёт им смысл. И за счёт того, что эти возможности описаны семантически, агент может работать с интерфейсом на том же уровне, на котором с ним работает человек.","chat":{"text":"Подробная ветка: Symbiote UI."}},"symbiote-engine-details":{"id":"symbiote-engine-details","sceneId":"symbiote-engine","directives":[{"id":"symbiote-engine-details.layers","type":"frame","target":"article.symbiote-engine.layer-diagram","policy":"required","timing":{"phase":"setup"}},{"id":"symbiote-engine-details.execution","type":"native-selection","target":"article.symbiote-engine.readonly-graph-demo","policy":"required","occurrence":1,"quote":"компонуемые серверные примитивы","timing":{"phase":"speech","anchor":"speech","quote":"Продукт может собрать свой процесс","occurrence":1,"edge":"start","offsetMs":-950}},{"id":"symbiote-engine-details.demo","type":"activate","target":"article.symbiote-engine.readonly-graph-demo","policy":"optional","safePath":"open-readonly-execution","timing":{"phase":"speech","anchor":"speech","quote":"Workspace затем связывает этот процесс","occurrence":1,"edge":"start","offsetMs":-1050}}],"return":{"anchor":"short.after.symbiote-engine","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Symbiote Engine предоставляет компонуемые серверные примитивы: обработчики, команды, графы выполнения и хранение состояния. Продукт собирает из них свой backend-процесс, а Workspace связывает исполнение с переносимой конфигурацией интерфейса. Я сохраняю разделение слоёв, чтобы Engine можно было использовать в разных рабочих средах и сервисах.","speech":"Symbiote Engine предоставляет компонуемые серверные примитивы. Это обработчики, команды, графы выполнения и хранение состояния. Идея здесь похожа на Symbiote UI. Я не хочу жёстко зашивать всю серверную логику внутрь одного продукта. Продукт может собрать свой процесс из небольших функциональных блоков. Workspace затем связывает этот процесс с интерфейсом и переносимой конфигурацией. Получается отдельный визуальный слой, отдельный исполнительный слой и понятный контракт между ними. Я специально сохраняю это разделение. Engine должен оставаться пригодным не только для Workspace. Его можно использовать в разных сервисах и рабочих средах, где нужен граф исполнения, состояние и управляемая автоматизация.","chat":{"text":"Подробная ветка: Symbiote Engine."}},"agent-portal-details":{"id":"agent-portal-details","sceneId":"agent-portal","directives":[{"id":"agent-portal-details.gallery","type":"activate","target":"article.agent-portal.workspace-gallery","policy":"required","safePath":"open-readonly-kanban-gallery","timing":{"phase":"setup"}},{"id":"agent-portal-details.board","type":"frame","target":"article.agent-portal.kanban-board","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Карточка здесь не просто запись о задаче","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"agent-portal-details.settings","type":"activate","target":"article.agent-portal.column-settings","policy":"optional","safePath":"open-readonly-settings","timing":{"phase":"speech","anchor":"speech","quote":"Каждая колонка может запускать свой этап","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"agent-portal-details.architecture","type":"frame","target":"article.agent-portal.process-diagram","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Для задач с кодом система","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"agent-portal-details.resource-groups","type":"frame","target":"article.agent-portal.resource-groups","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Модели, аккаунты и подписки","occurrence":1,"edge":"start","offsetMs":-1450}}],"return":{"anchor":"short.after.agent-portal","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Agent Portal — мой проект для управляемой агентной разработки. Я придумал и реализовал его архитектуру, а в работе мы использовали его как общую среду. Его управляющий контур mcp-agent-portal опубликован как open-source проект. В центре находится исполняемая канбан-доска: каждая колонка запускает часть процесса и может получить свои действия, роли и пул специализированных агентов. Для задач с кодом система создаёт изолированную рабочую копию и ветку. Один агент выполняет работу, другой независимо проверяет результат. Успешный аудит открывает путь к публикации, а конфликт переводит карточку к решению человека. Модели и подписки объединяются в группы ресурсов, поэтому этап получает исполнителя с подходящими возможностями и доступным лимитом.","speech":"В центре Agent Portal находится исполняемая канбан доска. Карточка здесь не просто запись о задаче. Она является частью реального процесса. Каждая колонка может запускать свой этап. Для неё можно задать действия, роли и пул специализированных агентов. Поэтому доска фактически становится визуальным описанием процесса исполнения. Для задач с кодом система может создать отдельную рабочую копию и отдельную ветку. Один агент выполняет задачу. После этого другой агент независимо проверяет результат. Если аудит проходит успешно, задача может двигаться дальше к публикации. Если агенты не согласны или появляется конфликт, карточка переводится к решению человека. Ещё одна часть архитектуры это управление ресурсами. Модели, аккаунты и подписки можно объединять в группы. Тогда конкретный этап получает исполнителя, у которого есть нужные возможности и доступный лимит. Это позволяет отделить логику процесса от конкретного провайдера или конкретной модели. Для меня Agent Portal стал практической лабораторией управляемой агентной разработки.","chat":{"text":"Подробная ветка: Agent Portal."}},"video-studio-details":{"id":"video-studio-details","sceneId":"symbiote-video-studio","directives":[{"id":"video-studio-details.flow","type":"frame","target":"article.symbiote-video-studio.semantic-flow","policy":"required","timing":{"phase":"setup"}},{"id":"video-studio-details.route","type":"marker","target":"article.symbiote-video-studio.semantic-flow","policy":"required","intent":"emphasize","shape":"route","series":"video-studio-flow","timing":{"phase":"speech","anchor":"speech","quote":"движок превращает его в реальные рабочие представления","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"video-studio-details.demo","type":"activate","target":"article.symbiote-video-studio.demo","policy":"required","safePath":"graph-timeline-preview","timing":{"phase":"speech","anchor":"speech","quote":"запустить живой предпросмотр","occurrence":1,"edge":"start","offsetMs":-1050}}],"return":{"anchor":"short.after.video-studio","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"В основе Studio лежит ядро Symbiote Video. Агент описывает структуру ролика семантическим описанием в формате JSON: сцены, слои, клипы и переходы. Движок превращает описание в граф, таймлайн и композицию. В рабочей среде можно проверить node graph, запустить live preview, сохранить состояние и перейти к экспорту. Видео-ядро уже работает, а Studio как универсальная конфигурация Workspace продолжает развиваться в alpha-режиме.","speech":"В основе Studio лежит отдельное ядро Symbiote Video. Структура ролика описывается семантически. Например, через сцены, слои, клипы и переходы. Агент может сформировать такое описание в формате джейсон. После этого движок превращает его в реальные рабочие представления. Можно посмотреть граф. Можно проверить таймлайн. Можно запустить живой предпросмотр результата. Состояние проекта сохраняется, после чего процесс может перейти к экспорту. Для меня здесь снова важна одна и та же идея. Агент работает не с непрозрачным редактором через случайные клики. У него есть семантическая модель проекта и объявленные действия. Видео ядро уже работает. Сама Studio как универсальная конфигурация Workspace продолжает развиваться в альфа режиме.","chat":{"text":"Подробная ветка: Symbiote Video Studio."}},"maximo-workbench-details":{"id":"maximo-workbench-details","sceneId":"adaptive-maximo-workbench","directives":[{"id":"maximo-details.work-order","type":"activate","target":"article.adaptive-maximo-workbench.work-order-demo","policy":"required","safePath":"open-readonly-work-order","timing":{"phase":"setup"}},{"id":"maximo-details.asset","type":"frame","target":"article.adaptive-maximo-workbench.asset-context","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Панели связывают заявки, активы","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"maximo-details.actions","type":"frame","target":"article.adaptive-maximo-workbench.safe-actions","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Интерфейс объявляет, что можно сделать","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"maximo-details.demo-1","type":"frame","target":"media/adaptive-maximo-workbench/youtube/qsXmS4mFvYc","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Поэтому это демо для меня не только пример интерфейса","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"maximo-details.demo-xr","type":"frame","target":"media/adaptive-maximo-workbench/youtube/DUzUnbO2VVs","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Икс ар версия проверяет тот же принцип","occurrence":1,"edge":"start","offsetMs":-1450}}],"return":{"anchor":"short.after.maximo-workbench","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"В этом демо Workspace получает предметную конфигурацию для обслуживания оборудования. Панели связывают заявки, активы, локации, бригады и безопасные действия. Агент читает тот же актуальный контекст, который видит человек, и работает через объявленные действия интерфейса. Этот контур проверяет архитектуру Workspace на корпоративном процессе. Реальные данные, авторизация и API системы Maximo подключаются отдельным интеграционным слоем.","speech":"Здесь Workspace получает предметную конфигурацию для обслуживания оборудования. Панели связывают заявки, активы, локации, бригады и доступные безопасные действия. Для меня здесь важен общий контекст. Агент работает не с абстрактным текстовым описанием задачи отдельно от интерфейса. Он читает тот же актуальный контекст, который находится перед человеком. Действия тоже не должны быть произвольными. Интерфейс объявляет, что можно сделать с конкретным объектом и какие ограничения действуют сейчас. За счёт этого рабочая среда может не только показать информацию, но и сопровождать сам процесс. Она может объяснить последовательность действий, подсветить риск или потребовать подтверждение перед критическим шагом. Поэтому это демо для меня не только пример интерфейса для Maximo. Оно проверяет архитектуру Workspace на сложном корпоративном процессе. Икс ар версия проверяет тот же принцип уже без ограничения плоским экраном. Контекст задачи, интерфейс и связанный с ним физический объект можно разместить в одном пространстве. Реальные данные Maximo, авторизация и эй пи ай при этом подключаются отдельным интеграционным слоем. Сам Workbench остаётся демонстрационным проектом и альфа версией архитектуры.","chat":{"text":"Подробная ветка: Adaptive Maximo Workbench."}},"agent-pool-details":{"id":"agent-pool-details","sceneId":"agent-pool-mcp","directives":[{"id":"agent-pool-details.runtime","type":"frame","target":"article.agent-pool-mcp.execution-runtime","policy":"required","timing":{"phase":"setup"}},{"id":"agent-pool-details.work","type":"marker","target":"article.agent-pool-mcp.work-branch","policy":"required","intent":"emphasize","shape":"route","series":"agent-pool-review","timing":{"phase":"speech","anchor":"speech","quote":"поручить реализацию одному агенту","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"agent-pool-details.review","type":"marker","target":"article.agent-pool-mcp.review-branch","policy":"required","intent":"emphasize","shape":"route","series":"agent-pool-review","timing":{"phase":"speech","anchor":"speech","quote":"независимую проверку результата другому","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"agent-pool-details.result","type":"marker","target":"article.agent-pool-mcp.result","policy":"required","intent":"emphasize","shape":"route","series":"agent-pool-review","timing":{"phase":"speech","anchor":"speech","quote":"общий структурированный ответ","occurrence":1,"edge":"start","offsetMs":-1500}}],"return":{"anchor":"short.after.agent-pool","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Я создавал Agent Pool MCP как независимый слой исполнения для разных CLI-агентов и моделей. Он поддерживает параллельные задачи, последовательные pipelines, handoff сессий, политики и группы ресурсов. Один процесс может поручить реализацию одному агенту, а независимую проверку — другому. В сценариях cross-model peer review агенты разных провайдеров сравнивают выводы и возвращают общий структурированный результат.","speech":"Я создавал Agent Pool как независимый слой исполнения для разных си эл ай агентов и разных моделей. Он не должен зависеть от одного конкретного провайдера. Система поддерживает параллельные задачи, последовательные пайплайны, передачу сессий, политики исполнения и группы ресурсов. Например, один процесс может поручить реализацию одному агенту. А независимую проверку результата другому. Так проверяющий агент не обязан наследовать рассуждения и предположения исполнителя. В сценариях кросс модельного ревью можно использовать модели разных провайдеров. Они независимо анализируют задачу, после чего результаты сравниваются и собираются в общий структурированный ответ. Для меня это способ строить процессы не вокруг одной умной модели, а вокруг системы исполнителей с разными ролями, возможностями и ограничениями.","chat":{"text":"Подробная ветка: Agent Pool MCP."}},"project-graph-details":{"id":"project-graph-details","sceneId":"project-graph-mcp","directives":[{"id":"project-graph-details.root","type":"frame","target":"article.project-graph-mcp.repository-root","policy":"required","timing":{"phase":"setup"}},{"id":"project-graph-details.skeleton","type":"frame","target":"article.project-graph-mcp.compact-skeleton","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"скелеты кода, компактная карта","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"project-graph-details.fact","type":"native-selection","target":"article.project-graph-mcp.browser-fact","policy":"required","occurrence":1,"quote":"проверяемые браузерные факты","timing":{"phase":"speech","anchor":"speech","quote":"факты браузерной или другой внешней проверки","occurrence":1,"edge":"start","offsetMs":-950}},{"id":"project-graph-details.focus","type":"frame","target":"article.project-graph-mcp.focus-zone","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"уже сфокусированный контекст","occurrence":1,"edge":"start","offsetMs":-1450}}],"return":{"anchor":"short.after.project-graph","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Project Graph MCP анализирует структуру репозитория и готовит несколько представлений: зависимости, скелеты кода, краткую карту проекта и факты браузерной проверки. Более быстрая модель может собрать эту карту, а сильная модель получает сфокусированный контекст для решения. Я использую этот слой как context engineering и структурированное извлечение с графовыми связями.","speech":"Project Graph анализирует структуру репозитория и готовит несколько представлений одного проекта. Это зависимости, скелеты кода, компактная карта и проверяемые факты. Цель здесь не в том, чтобы загрузить весь репозиторий в контекст модели. Наоборот. Сначала строится компактная структура. После этого сильная модель получает только тот участок, который действительно нужен для конкретной задачи. Отдельно система может хранить факты браузерной или другой внешней проверки. То есть модель получает не только пересказ кода, но и структурированный контекст с происхождением конкретной информации. Более быстрая и дешёвая модель может заниматься построением карты. А более сильная модель использовать уже сфокусированный контекст для решения сложной задачи. Я рассматриваю этот слой как практический context engineering. То есть как управление тем, какую структуру проекта модель видит, в каком объёме и с какими связями.","chat":{"text":"Подробная ветка: Project Graph MCP."}},"lifecycle-platform-details":{"id":"lifecycle-platform-details","sceneId":"lifecycle-messaging-platform","directives":[{"id":"lifecycle-details.product","type":"frame","target":"article.lifecycle-messaging-platform.product-surfaces","policy":"required","timing":{"phase":"setup"}},{"id":"lifecycle-details.runtime","type":"frame","target":"article.lifecycle-messaging-platform.backend-runtime","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Эй пи ай и база PostgreSQL","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"lifecycle-details.delivery","type":"frame","target":"article.lifecycle-messaging-platform.delivery-ops","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"управляли пулами джи эс эм модемов","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"lifecycle-details.route","type":"marker","target":"article.lifecycle-messaging-platform.delivery-flow","policy":"required","intent":"emphasize","shape":"route","series":"lifecycle-delivery","timing":{"phase":"speech","anchor":"speech","quote":"очередь, повторяемое выполнение","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"lifecycle-details.twin","type":"marker","target":"article.lifecycle-messaging-platform.digital-twin","policy":"required","intent":"emphasize","shape":"parallel-route","series":"lifecycle-twin","timing":{"phase":"speech","anchor":"speech","quote":"локальный Digital Twin","occurrence":1,"edge":"start","offsetMs":-1500}}],"return":{"anchor":"short.after.lifecycle-platform","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Платформа соединяла веб-продукт, серверную инфраструктуру и физическую доставку через модемы. API и PostgreSQL хранили продуктовые данные. WebSocket связывал runtime, а распределённые инстансы управляли пулами GSM-модемов через serial и AT-команды. Связь и устройства могли менять состояние, поэтому очередь, повторяемое выполнение и мониторинг сохраняли управляемость процесса. Digital Twin воспроизводил физический контур для локальной проверки. В одном историческом эксперименте создание материалов и их проверка работали как независимые контуры с разными правилами оценки.","speech":"Этот проект соединял сразу несколько разных слоёв. Был веб продукт. Была серверная инфраструктура. И был физический контур доставки через модемы. Эй пи ай и база PostgreSQL хранили продуктовые данные и состояние системы. WebSocket связывал сервер с удалёнными исполнительными инстансами. Эти инстансы управляли пулами джи эс эм модемов через serial интерфейс и эй ти команды. В таком контуре нельзя исходить из того, что сеть и устройство всегда находятся в идеальном состоянии. Связь может пропасть. Модем может изменить состояние. Удалённый инстанс может перезапуститься. Поэтому очередь, повторяемое выполнение, состояние задач и мониторинг были частью самой архитектуры. Я старался сделать процесс восстанавливаемым и наблюдаемым на каждом этапе. При этом тестировать всё только на реальном пуле модемов неудобно и дорого. Поэтому я сделал локальный Digital Twin. Он воспроизводил физический контур виртуальными устройствами и позволял повторять нужные сценарии локально.","chat":{"text":"Подробная ветка: Lifecycle Messaging Platform."}},"mobile-smm-details":{"id":"mobile-smm-details","sceneId":"mobile-smm-platform","directives":[{"id":"mobile-smm-details.gallery","type":"frame","target":"article.mobile-smm-platform.media-gallery","policy":"required","timing":{"phase":"setup"}},{"id":"mobile-smm-details.schedule","type":"frame","target":"article.mobile-smm-platform.schedule","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Сервер управляет расписанием, очередью","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"mobile-smm-details.queue","type":"frame","target":"article.mobile-smm-platform.queue","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"подготовленный сценарий в формате джейсон","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"mobile-smm-details.ui-change","type":"activate","target":"article.mobile-smm-platform.ui-change-demo","policy":"required","safePath":"stop-analyze-propose-for-review","timing":{"phase":"speech","anchor":"speech","quote":"структура экрана больше не соответствует","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"mobile-smm-details.draft","type":"activate","target":"article.mobile-smm-platform.local-demo","policy":"required","safePath":"draft-test-target-approval-dry-run","timing":{"phase":"speech","anchor":"speech","quote":"Этот вариант сначала передаётся на проверку","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"mobile-smm-details.approval","type":"frame","target":"article.mobile-smm-platform.approval-log","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"лимиты, устойчивую дедупликацию и подтверждение","occurrence":1,"edge":"start","offsetMs":-1450}}],"return":{"anchor":"short.after.mobile-smm","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"В центре системы находится модель профилей, аккаунтов, медиаматериалов и публикаций. Сервер управляет расписанием, очередью и подключёнными Android-устройствами. Готовый JSON-сценарий выполняет стабильный путь и записывает результат в журнал. Если структура экрана изменилась, исполнитель останавливается в безопасной точке. Агент анализирует актуальный экран, готовит обновлённый сценарий и передаёт его на проверку. Исходящие действия проходят через лимиты, устойчивую дедупликацию и approval. Демонстрация заканчивается dry-run или подтверждением в журнале без внешней отправки.","speech":"В центре системы находится модель профилей, аккаунтов, медиаматериалов и публикаций. Сервер управляет расписанием, очередью и подключёнными Андроид устройствами. Для стабильных участков процесса используется заранее подготовленный сценарий в формате джейсон. Он выполняет известный путь и записывает результат в журнал. Это дешевле и надёжнее, чем просить модель заново рассуждать на каждом обычном шаге. Но мобильный интерфейс может измениться. Если структура экрана больше не соответствует ожидаемому сценарию, исполнитель не должен продолжать нажимать вслепую. Он останавливается в безопасной точке. После этого агент анализирует новое состояние интерфейса и готовит обновлённый вариант сценария. Этот вариант сначала передаётся на проверку. Исходящие действия проходят через лимиты, устойчивую дедупликацию и подтверждение. Поэтому повторный запуск процесса не должен случайно дублировать уже выполненное действие. Здесь я соединяю детерминированну
