,"occurrence":1,"edge":"start","offsetMs":-1500}}],"branchId":"symbiote-engine-details","title":"Symbiote Engine","subtitle":"Функциональные блоки даёт Symbiote Engine. Это серверная библиотека для сервисов, графов выполнения и автоматизации. Workspace соединяет визуальные блоки UI с этим исполнительным слоем в одной конфигурации.","speech":"Функциональные блоки даёт Symbiote Engine. Это серверная библиотека для сервисов, графов выполнения и автоматизации. Workspace соединяет визуальные блоки UI с этим исполнительным слоем в одной конфигурации.","chat":{"actionLabel":"Подробнее о Symbiote Engine","text":"Показываю исполнительный слой — Symbiote Engine."}},{"id":"agent-portal","period":"2025–2026","projectId":"projects/agent-portal","directives":[{"id":"agent-portal.open","type":"navigate","target":"projects/agent-portal","policy":"required","timing":{"phase":"setup"}},{"id":"agent-portal.path","type":"marker","target":"article.agent-portal.process-path","policy":"required","intent":"emphasize","shape":"route","series":"agent-portal-process","timing":{"phase":"speech","anchor":"speech","quote":"один видимый процесс","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"agent-portal.human-decision","type":"marker","target":"article.agent-portal.human-decision","policy":"required","intent":"emphasize","shape":"oval","series":"agent-portal-process","timing":{"phase":"speech","anchor":"speech","quote":"контроль над контекстом, задачами и ресурсами","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"agent-portal.open-source","type":"frame","target":"article.agent-portal.open-source","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Мы решили открыть управляющий контур","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"agent-portal.github-link","type":"frame","target":"project-link.agent-portal.github","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Гитхаб","occurrence":1,"edge":"start","offsetMs":-1450}},{"id" ортал, хотя развиваем Эйджент Портал прежде всего для собственной практической работы. Исходный код этого контура доступен на Гитхаб, а интерфейс Эйджент Портал можно посмотреть в интерактивном демо. Чтобы показать его внутреннее устройство, дальше я разберу два отдельных инструмента. Эйджент Пул эм-си-пи отвечает за исполнение и распределение ресурсов, а Проджект Граф эм-си-пи — за структуру и контекст проекта.","chat":{"actionLabel":"Подробнее об Agent Portal","text":"Показываю Agent Portal и его исполняемый процесс."}},{"id":"symbiote-video-studio","period":"2025–2026","projectId":"projects/symbiote-video-studio","directives":[{"id":"video-studio.open","type":"navigate","target":"projects/symbiote-video-studio","policy":"required","timing":{"phase":"setup"}},{"id":"video-studio.visible-process","type":"native-selection","target":"article.symbiote-video-studio.semantic-flow","policy":"required","occurrence":1,"quote":"один видимый процесс","timing":{"phase":"speech","anchor":"speech","quote":"предпросмотр и рендер","occurrence":1,"edge":"start","offsetMs":-950}},{"id":"video-studio.demo","type":"activate","target":"article.symbiote-video-studio.demo","policy":"required","safePath":"graph-timeline-preview","timing":{"phase":"speech","anchor":"speech","quote":"Агент работает","occurrence":1,"edge":"start","offsetMs":-1050}}],"branchId":"video-studio-details","title":"Symbiote Video Studio","subtitle":"Ещё один актуальный проект — Symbiote Video Studio. Материалы, граф, таймлайн, предпросмотр и рендер собраны здесь в один видимый процесс. Агент работает с семантическими элементами интерфейса, а человек может проверить каждый этап. Сейчас Studio оформляется как конфигурация Symbiote Workspace.","speech":"Ещё один актуальный проект — Симбиот Видео Студио. Материалы, граф, таймлайн, предпросмотр и рендер собраны здесь в один видимый процесс. Агент работает с семантическими элементами интерфейса, а человек может проверить каждый этап. Сейчас Студио оформляется как конфиг лиентских коммуникаций. Она включает сегментацию аудитории, управление маркетинговыми кампаниями, опт-ин эс-эм-эс сценарии и аналитику. Я проектировал эй-пи-ай, распределение заданий, связь с удалёнными инстансами, мониторинг и инструменты эксплуатации. Для проверки модемного контура я сделал локальный Диджитал Твин с виртуальными устройствами и воспроизводимыми сценариями.","chat":{"actionLabel":"Подробнее о Lifecycle Messaging Platform","text":"Показываю распределённый контур Lifecycle Messaging Platform."}},{"id":"mobile-smm-platform","period":"Date pending","projectId":"projects/mobile-smm-platform","directives":[{"id":"mobile-smm.open","type":"navigate","target":"projects/mobile-smm-platform","policy":"required","timing":{"phase":"setup"}},{"id":"mobile-smm.overview","type":"frame","target":"article.mobile-smm-platform.system-map","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"В одном контуре","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"mobile-smm.stable-path","type":"marker","target":"article.mobile-smm-platform.stable-path","policy":"required","intent":"emphasize","shape":"route","series":"mobile-smm-flow","timing":{"phase":"speech","anchor":"speech","quote":"Андроид-устройства","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"mobile-smm.agent-update","type":"marker","target":"article.mobile-smm-platform.agent-update","policy":"required","intent":"emphasize","shape":"oval","series":"mobile-smm-flow","timing":{"phase":"speech","anchor":"speech","quote":"При изменении интерфейса","occurrence":1,"edge":"start","offsetMs":-2800}}],"branchId":"mobile-smm-details","title":"Мобильная SMM-платформа","subtitle":"Отдельный прикладной кейс — мобильная SMM-платформа для управляемой работы с несколькими профилями. В одном контуре собраны медиаматериалы, публикации, расписание, входящие обращения и очередь. Android-устройства выполняют стабильные операции по готовым сценариям. При изменении интерфейса агент останавливает процесс, анализирует экран и готовит обновление сценария для проверки. Управляемость обеспечивают лимиты, дедупликация, согласование и журнал.","speech":"Отдельный прикладной кейс — мобильная эс-эм-эм платформа для управляемой работы с несколькими профилями. В одном контуре собраны медиаматериалы, публикации, расписание, входящие обращения и очередь. Андроид-устройства выполняют стабильные операции по готовым сценариям. При изменении интерфейса агент останавливает процесс, анализирует экран и готовит обновление сценария для проверки. Управляемость обеспечивают лимиты, дедупликация, согласование и журнал.","chat":{"actionLabel":"Подробнее о мобильной SMM-платформе","text":"Показываю отдельный прикладной кейс мобильной SMM-платформы."}},{"id":"f360-studio","period":"2021–2022","projectId":"projects/f360-studio","directives":[{"id":"f360.open","type":"navigate","target":"projects/f360-studio","policy":"required","timing":{"phase":"setup"}},{"id":"f360.process","type":"frame","target":"article.f360-studio.production-path","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"процесс от физической","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"f360.result","type":"activate","target":"article.f360-studio.gallery-result","policy":"required","safePath":"open-source-backed-result","timing":{"phase":"speech","anchor":"speech","quote":"готовой презентации модели","occurrence":1,"edge":"start","offsetMs":-1050}}],"branchId":"f360-details","title":"F360 Studio","subtitle":"Теперь вернусь по истории программно-аппаратных проектов. В 2021–2022 годах я основал и вёл F360 Studio. Это проект высокоточного 3D-сканирования. Я выстраивал процесс от физической съёмочной установки и управляемого света до геометрии, текстур и готовой презентации модели. При переезде в Аргентину физическую производственную базу пришлось закрыть.","speech":"Теперь вернусь по истории программно-аппаратных проектов. В две тысячи двадцать первом — две тысячи двадцать втором годах я основал и вёл проект «Эф триста шестьдесят Студио». Он занимался высокоточным три дэ-сканированием. Я выстраивал процесс от физической съёмочной установки и управляемого света до геометрии, текстур и готовой презентации модели. При переезде в Аргентину физическую производственную базу пришлось закрыть.","chat":{"actionLabel":"Подробнее о F360 Studio","text":"Перехожу к исторической программно-аппаратной ветке и F360 Studio."}},{"id":"autobox","period":"2019–2021","projectId":"projects/autobox-v1","directives":[{"id":"autobox.open","type":"navigate","target":"projects/autobox-v1","policy":"required","timing":{"phase":"setup"}},{"id":"autobox.video-01","type":"frame","target":"media/autobox-v1/youtube/IPEY0yiVb-I","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Здесь показана предварительная три дэ-визуализация оборудования Авто Бокс","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-02","type":"frame","target":"media/autobox-v1/youtube/NWpMtNZjrzI","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Здесь я отлаживаю процесс фотограмметрии","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-03","type":"frame","target":"media/autobox-v1/youtube/8XsSHyQFtV8","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Здесь показан промежуточный результат той же отладки","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-04","type":"frame","target":"media/autobox-v1/youtube/zb47xAYQBcE","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Здесь я собственноручно изготавливаю","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-05","type":"frame","target":"media/autobox-v1/youtube/us3vQHuTYPw","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Здесь собранный прототип первой версии Авто Бокс","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-06","type":"frame","target":"media/autobox-v1/youtube/FugBzpZqXZ0","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Это вводный ролик эрмитажной серии","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-07","type":"frame","target":"media/autobox-v1/youtube/iNqxRJgrqM8","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Для того же позолоченного Будды","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-08","type":"frame","target":"media/autobox-v1/youtube/M0cHqy3cScc","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Здесь — художественная визуализация могольского кинжала","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox.video-09","type":"frame","target":"media/autobox-v1/youtube/o4XzMKW8a2E","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Здесь — художественная визуализация головы королевы-матери","occurrence":1,"edge":"start","offsetMs":-1450}}],"branchId":"autobox-details","title":"AUTOBOX","subtitle":"Перед F360 была музейная технология AUTOBOX, которую я развивал в 2019–2021 годах. Здесь показана предварительная 3D-визуализация оборудования AUTOBOX. Я подготовил её ещё до сборки установки, чтобы представить будущую конструкцию партнёрам, с которыми мы работали над 3D-сканированием музейных объектов в Эрмитаже. Здесь я отлаживаю процесс фотограмметрии на поворотном столе PhotoPizza. Это один из предварительных экспериментов, проведённых до разработки установки для Эрмитажа. Здесь показан промежуточный результат той же отладки в RealityCapture. Слева видны исходные фотографии позолоченного Будды, а в 3D-пространстве я вращаю уже обработанную модель и проверяю результат фотограмметрии перед разработкой оборудования для Эрмитажа. Здесь я собственноручно изготавливаю одну из деталей AUTOBOX v1 — лазером вырезаю вентиляционную сетку для светового модуля. Здесь собранный прототип AUTOBOX v1 сканирует нэцкэ в Эрмитаже. Это вводный ролик эрмитажной серии «Нэцкэ под увеличительным стеклом». Представленные в ней нэцкэ я собственноручно сканировал и визуализировал во время отладки технологии AUTOBOX. Для того же позолоченного Будды я сделал художественную 3D-визуализацию. Она показывает качество сканирования сложного металлического объекта: сохранились мелкие детали, повреждения и царапины. Здесь — художественная визуализация могольского кинжала из собрания Эрмитажа. Сочетание полированного металла, позолоты и инкрустации драгоценными камнями делало его особенно сложным для фотограмметрии, но нам удалось сохранить и форму, и детали разных материалов. Здесь — художественная визуализация головы королевы-матери из Королевства Бенин. Сканирование точно передало сложный рельеф и патину бронзовой поверхности.","speech":"Перед эф триста шестьдесят была музейная технология Авто Бокс, которую я развивал в две тысячи девятнадцатом — две тысячи двадцать первом годах. Здесь показана предварительная три дэ-визуализация оборудования Авто Бокс. Я подготовил её ещё до сборки установки, чтобы представить будущую конструкцию партнёрам, с которыми мы работали над три дэ-сканированием музейных объектов в Эрмитаже. Здесь я отлаживаю процесс фотограмметрии на поворотном столе PhotoPizza. Это один из предварительных экспериментов, проведённых до разработки установки для Эрмитажа. Здесь показан промежуточный результат той же отладки в Реалити Кэпчер. Слева видны исходные фотографии позолоченного Будды, а в три дэ-пространстве я вращаю уже обработанную модель и проверяю результат фотограмметрии перед разработкой оборудования для Эрмитажа. Здесь я собственноручно изготавливаю одну из деталей первой версии Авто Бокс — лазером вырезаю вентиляционную сетку для светового модуля. Здесь собранный прототип первой версии Авто Бокс сканирует нэцкэ в Эрмитаже. Это вводный ролик эрмитажной серии «Нэцкэ под увеличительным стеклом». Представленные в ней нэцкэ я собственноручно сканировал и визуализировал во время отладки технологии Авто Бокс. Для того же позолоченного Будды я сделал художественную три дэ-визуализацию. Она показывает качество сканирования сложного металлического объекта: сохранились мелкие детали, повреждения и царапины. Здесь — художественная визуализация могольского кинжала из собрания Эрмитажа. Сочетание полированного металла, позолоты и инкрустации драгоценными камнями делало его особенно сложным для фотограмметрии, но нам удалось сохранить и форму, и детали разных материалов. Здесь — художественная визуализация головы королевы-матери из Королевства Бенин. Сканирование точно передало сложный рельеф и патину бронзовой поверхности.","chat":{"actionLabel":"Подробнее об AUTOBOX","text":"Показываю музейную технологию AUTOBOX."}},{"id":"complexscan","period":"2017–2022","projectId":"projects/complexscan","directives":[{"id":"complexscan.open","type":"navigate","target":"projects/complexscan","policy":"required","timing":{"phase":"setup"}},{"id":"complexscan.line","type":"frame","target":"article.complexscan.product-line","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"коммерческой линии оборудования","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"complexscan.video-01","type":"frame","target":"media/complexscan/youtube/MHfWHxVSgn4","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Здесь я демонстрирую одну из таких платформ","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"complexscan.video-02","type":"frame","target":"media/complexscan/youtube/PFPoitVEWcE","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Здесь я показываю обновлённые версии","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"complexscan.delivery","type":"native-selection","target":"article.complexscan.international-delivery","policy":"required","occurrence":1,"quote":"доставки клиентам в разные страны","timing":{"phase":"speech","anchor":"speech","quote":"международных поставок","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"complexscan.boothbot-open","type":"navigate","target":"projects/boothbot","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Отдельным прикладным проектом стал Бут Бот","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"complexscan.boothbot-gallery","type":"media","target":"media/boothbot/ims/gallery","policy":"required","finalFrame":5,"frameHoldMs":250,"frames":[1,2,3,4,5],"mode":"short-muted-montage","safePath":"boothbot-five-frame-gallery-sequence","timing":{"phase":"speech","anchor":"speech","quote":"Система объединяла компактную съёмочную будку","occurrence":1,"edge":"start","offsetMs":-2050}},{"id":"complexscan.boothbot-catalog-ready","type":"marker","target":"article.boothbot.solution","policy":"required","intent":"emphasize","shape":"oval","series":"boothbot-result","quote":"готовый материал для каталога","occurrence":1,"timing":{"phase":"speech","anchor":"speech","quote":"готовый материал для каталога","occurrence":1,"edge":"start","offsetMs":-3300}}],"branchId":"complexscan-details","title":"ComplexScan","subtitle":"Теперь вернусь к ComplexScan — коммерческой линии оборудования, чьи разработки стали частью технической базы AUTOBOX. Я развивал ComplexScan в 2017–2022 годах. В линию входили прозрачные платформы для бестеневой съёмки предметов в формате фото 360 и для 3D-сканирования. Здесь я демонстрирую одну из таких платформ и веб-приложение, из которого управляю ею. Здесь я показываю обновлённые версии поворотной платформы ComplexScan и веб-приложения для управления ею. Я проектировал оборудование и метод съёмки как единый продукт и довёл линию до первых международных поставок. Отдельным прикладным проектом стал BoothBot. Это система автоматизации каталожной съёмки винных бутылок непосредственно на складе заказчика. Система объединяла компактную съёмочную будку, управляемые световые панели, моторизированную камеру, пресеты съёмки и автоматическую обработку фотографий. Световая сцена была заранее настроена для бестеневой съёмки и контролируемых бликов, поэтому фотографии практически не требовали ручной коррекции. Система автоматически отделяла бутылку от фона, оптимизировала изображение и выдавала готовый материал для каталога. Благодаря этому сотрудники без студийного опыта могли получать повторяемый результат прямо на складе. Следующим этапом должна была стать прямая публикация готовых фотографий на сайте, но после моего переезда в Аргентину развитие проекта было приостановлено.","speech":"Теперь вернусь к Комплекс Скан — коммерческой линии оборудования, чьи разработки стали частью технической базы Авто Бокс. Я развивал Комплекс Скан в две тысячи семнадцатом — две тысячи двадцать втором годах. В линию входили прозрачные платформы для бестеневой съёмки предметов в формате фото триста шестьдесят и для три дэ-сканирования. Здесь я демонстрирую одну из таких платформ и веб-приложение, из которого управляю ею. Здесь я показываю обновлённые версии поворотной платформы Комплекс Скан и веб-приложения для управления ею. Я проектировал оборудование и метод съёмки как единый продукт и довёл линию до первых международных поставок. Отдельным прикладным проектом стал Бут Бот. Это система автоматизации каталожной съёмки винных бутылок непосредственно на складе заказчика. Система объединяла компактную съёмочную будку, управляемые световые панели, моторизированную камеру, пресеты съёмки и автоматическую обработку фотографий. Световая сцена была заранее настроена для бестеневой съёмки и контролируемых бликов, поэтому фотографии практически не требовали ручной коррекции. Система автоматически отделяла бутылку от фона, оптимизировала изображение и выдавала готовый материал для каталога. Благодаря этому сотрудники без студийного опыта могли получать повторяемый результат прямо на складе. Следующим этапом должна была стать прямая публикация готовых фотографий на сайте, но после моего переезда в Аргентину развитие проекта было приостановлено.","chat":{"actionLabel":"Подробнее о ComplexScan","text":"Показываю коммерческую иложение PhotoPizza","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza.controller","type":"frame","target":"article.photopizza.controller","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Универсальный блок управления","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"photopizza.spinner","type":"frame","target":"media/photopizza/ims/spinner","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"На грузовой поворотной платформе PhotoPizza","occurrence":1,"edge":"start","offsetMs":-1450}}],"branchId":"photopizza-details","title":"PhotoPizza","subtitle":"В начале этой линии была PhotoPizza, которую я развивал с 2010 года. Проект появился внутри MEGAVISOR как инструмент для повторяемой съёмки объектов на 360 градусов. Здесь показан ускоренный демонстрационный ролик о сборке первой версии PhotoPizza — без подробной инструкции. Это промо MEGAVISOR, где показан весь спектр поддерживаемого контента, включая съёмку объектов на 360 градусов. Я продумал механику, электронику, прошивку, документацию и упаковку. Таймлапс сборки прототипа PhotoPizza из конструкционного алюминиевого профиля и шагового двигателя. Позже PhotoPizza стала open-source проектом. Здесь я показываю, как собрать простую поворотную платформу из подноса IKEA и вручную снять объект со всех сторон. Такие демонстрационные ролики я продюсировал для MEGAVISOR, чтобы популяризировать формат и снизить порог входа в технологию. Здесь я показываю новое веб-приложение PhotoPizza: с телефона запускаю съёмку и по Wi‑Fi управляю поворотным столом и камерой через веб-приложение. Универсальный блок управления работал с поворотными платформами, слайдером камеры и моторизированной панорамной головкой. На грузовой поворотной платформе PhotoPizza мы снимали даже тяжёлые объекты, включая мотоциклы, на 360 градусов. Проект продолжал развиваться до моего переезда в Аргентину в 2022 году.","speech":"В начале этой линии была PhotoPizza, которую я развивал с две тыс rtal.workspace-gallery","policy":"required","safePath":"open-readonly-kanban-gallery","timing":{"phase":"setup"}},{"id":"agent-portal-details.board","type":"frame","target":"article.agent-portal.kanban-board","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"В центре находится","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"agent-portal-details.settings","type":"activate","target":"article.agent-portal.column-settings","policy":"optional","safePath":"open-readonly-settings","timing":{"phase":"speech","anchor":"speech","quote":"каждая колонка","occurrence":1,"edge":"start","offsetMs":-1050}},{"id":"agent-portal-details.architecture","type":"frame","target":"article.agent-portal.process-diagram","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Для задач с кодом","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"agent-portal-details.resource-groups","type":"frame","target":"article.agent-portal.resource-groups","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Модели и подписки","occurrence":1,"edge":"start","offsetMs":-1450}}],"return":{"anchor":"short.after.agent-portal","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Agent Portal — мой проект для управляемой агентной разработки. Я придумал и реализовал его архитектуру, а в работе мы использовали его как общую среду. Его управляющий контур mcp-agent-portal опубликован как open-source проект. В центре находится исполняемая канбан-доска: каждая колонка запускает часть процесса и может получить свои действия, роли и пул специализированных агентов. Для задач с кодом система создаёт изолированную рабочую копию и ветку. Один агент выполняет работу, другой независимо проверяет результат. Успешный аудит открывает путь к публикации, а конфликт переводит карточку к решению человека. Модели и подписки объединяются в группы ресурсов, поэтому этап получает исполнителя с подходящими возможностями и доступным лимитом.","speech":"Эйд h, запустить live preview, сохранить состояние и перейти к экспорту. Видео-ядро уже работает, а Studio как универсальная конфигурация Workspace продолжает развиваться в alpha-режиме.","speech":"В основе Студии лежит ядро Симбиот Видео. Агент описывает структуру ролика семантическим описанием в формате джейсон: сцены, слои, клипы и переходы. Движок превращает описание в граф, таймлайн и композицию. В рабочей среде можно проверить нод-граф, запустить лайв-превью, сохранить состояние и перейти к экспорту. Видео-ядро уже работает, а Студия как универсальная конфигурация Воркспейса продолжает развиваться в альфа-режиме.","chat":{"text":"Подробная ветка: Symbiote Video Studio."}},"maximo-workbench-details":{"id":"maximo-workbench-details","sceneId":"adaptive-maximo-workbench","directives":[{"id":"maximo-details.work-order","type":"activate","target":"article.adaptive-maximo-workbench.work-order-demo","policy":"required","safePath":"open-readonly-work-order","timing":{"phase":"setup"}},{"id":"maximo-details.asset","type":"frame","target":"article.adaptive-maximo-workbench.asset-context","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Панели связывают","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"maximo-details.actions","type":"frame","target":"article.adaptive-maximo-workbench.safe-actions","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"работает через объявленные действия","occurrence":1,"edge":"start","offsetMs":-1450}}],"return":{"anchor":"short.after.maximo-workbench","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"В этом демо Workspace получает предметную конфигурацию для обслуживания оборудования. Панели связывают заявки, активы, локации, бригады и безопасные действия. Агент читает тот же актуальный контекст, который видит человек, и работает через объявленные действия интерфейса. Этот контур проверяет архитектуру Workspace на корпоративном процессе. Реальные данные, авторизация и API системы исимости, скелеты кода, краткую карту проекта и факты браузерной проверки. Более быстрая модель может собрать эту карту, а сильная модель получает сфокусированный контекст для решения. Я использую этот слой как context engineering и структурированное извлечение с графовыми связями.","speech":"Project Graph MCP анализирует структуру репозитория и готовит несколько представлений: зависимости, скелеты кода, краткую карту проекта и факты браузерной проверки. Более быстрая модель может собрать эту карту, а сильная модель получает сфокусированный контекст для решения. Я использую этот слой как context engineering и структурированное извлечение с графовыми связями.","chat":{"text":"Подробная ветка: Project Graph MCP."}},"lifecycle-platform-details":{"id":"lifecycle-platform-details","sceneId":"lifecycle-messaging-platform","directives":[{"id":"lifecycle-details.product","type":"frame","target":"article.lifecycle-messaging-platform.product-surfaces","policy":"required","timing":{"phase":"setup"}},{"id":"lifecycle-details.runtime","type":"frame","target":"article.lifecycle-messaging-platform.backend-runtime","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"Эй-пи-ай","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"lifecycle-details.delivery","type":"frame","target":"article.lifecycle-messaging-platform.delivery-ops","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"управляли пулами","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"lifecycle-details.route","type":"marker","target":"article.lifecycle-messaging-platform.delivery-flow","policy":"required","intent":"emphasize","shape":"route","series":"lifecycle-delivery","timing":{"phase":"speech","anchor":"speech","quote":"очередь, повторяемое выполнение","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"lifecycle-details.twin","type":"marker","target":"article.lifecycle-messaging-platform.digital-twin","policy":"required","intent":"emphasize","shape":"paralle роводил фотограмметрическую обработку и проверял геометрию с текстурами. Я собрал единый производственный путь от установки до финальной три D-модели и её публикации. Публичные примеры сохранились на YouTube и в портфолио Sketchfab. Студия завершила работу в две тысячи двадцать втором году во время моего переезда.","chat":{"text":"Подробная ветка: F360 Studio."}},"autobox-details":{"id":"autobox-details","sceneId":"autobox","directives":[{"id":"autobox-details.working-system","type":"frame","target":"article.autobox-v1.working-system","policy":"required","timing":{"phase":"setup"}},{"id":"autobox-details.working-route","type":"marker","target":"article.autobox-v1.working-system","policy":"required","intent":"emphasize","shape":"route","series":"autobox-working","timing":{"phase":"speech","anchor":"speech","quote":"компьютерное зрение","occurrence":1,"edge":"start","offsetMs":-1500}},{"id":"autobox-details.video","type":"frame","target":"article.autobox-v1.netsuke-video","policy":"optional","timing":{"phase":"speech","anchor":"speech","quote":"В Эрмитаже я сканировал","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"autobox-details.bronze","type":"activate","target":"article.autobox-v1.benin-bronze","policy":"optional","safePath":"rotate-interactive-model","timing":{"phase":"speech","anchor":"speech","quote":"бенинской бронзы","occurrence":1,"edge":"start","offsetMs":-1050}}],"return":{"anchor":"short.after.autobox","replayCompletedSpeech":false,"resume":"paused"},"subtitle":"Рабочая система управляла камерой, светом и позиционированием. Она сначала снимала полную серию, после чего компьютерное зрение анализировало материал, оценивало резкость и отбирало исходники для построения 3D-модели. Следующий прототип начинал с чернового 3D-сканирования и упрощённой формы предмета. Затем он заранее рассчитывал весь план детальной макросъёмки: зоны, ракурсы, положения камеры, параметры оптики, глубину резкости и перекрытие. Расчёт учитывал сложную геометрию предмета, диапазон механики, габариты камеры, препятствия и безопасное расстояние. После проверки принципа я проектировал дополнительные контуры безопасности, включая лидарный контроль расстояния на случай смещения предмета. Этот слой остался следующим этапом разработки. Система AUTOBOX уже применялась в музеях. В Эрмитаже я сканировал японские нэцкэ, а технологическая линия применялась для бенинской бронзы в Кунсткамере.","speech":"Рабочая система управляла камерой, светом и позиционированием. Она сначала снимала полную серию, после чего компьютерное зрение анализировало материал, оценивало резкость и отбирало исходники для построения три дэ-модели. Следующий прототип начинал с чернового три дэ-сканирования и упрощённой формы предмета. Затем он заранее рассчитывал весь план детальной макросъёмки: зоны, ракурсы, положения камеры, параметры оптики, глубину резкости и перекрытие. Расчёт учитывал сложную геометрию предмета, диапазон механики, габариты камеры, препятствия и безопасное расстояние. После проверки принципа я проектировал дополнительные контуры безопасности, включая лидарный контроль расстояния на случай смещения предмета. Этот слой остался следующим этапом разработки. Система Авто Бокс уже применялась в музеях. В Эрмитаже я сканировал японские нэцкэ, а технологическая линия применялась для бенинской бронзы в Кунсткамере.","chat":{"text":"Подробная ветка: AUTOBOX."}},"complexscan-details":{"id":"complexscan-details","sceneId":"complexscan","directives":[{"id":"complexscan-details.platform","type":"frame","target":"article.complexscan.transparent-platform","policy":"required","timing":{"phase":"setup"}},{"id":"complexscan-details.light","type":"frame","target":"article.complexscan.controlled-light","policy":"required","timing":{"phase":"speech","anchor":"speech","quote":"управляемый свет","occurrence":1,"edge":"start","offsetMs":-1450}},{"id":"complexscan-details.gallery","type":"activate","target":"article.complexscan.product-gallery","policy":"required","safePath":"pro
